<script>
  // ============ window.storage shim — Google Sheets backend ============
  (function () {
    const LS_PREFIX = 'ccs-dr::';
    const cfg = window.CCS_CONFIG || {};
    const url = (cfg.SHEETS_URL || '').trim();
    const hasBackend = url && url.startsWith('http');
    if (!hasBackend) document.getElementById('config-banner').classList.add('show');

    async function readSheet(key) {
      const resp = await fetch(url + '?key=' + encodeURIComponent(key), { method: 'GET', redirect: 'follow' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return await resp.text();
    }
    async function writeSheet(payload) {
      await fetch(url, {
        method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload),
      });
    }

    window.storage = {
      async get(key) {
        if (hasBackend) {
          try {
            const text = await readSheet(key);
            if (text) { try { localStorage.setItem(LS_PREFIX + key, text); } catch (_) {} return { value: text }; }
          } catch (e) { console.warn('[CCS-DR] Sheet read failed:', e.message); }
        }
        try { const raw = localStorage.getItem(LS_PREFIX + key); return raw ? { value: raw } : null; }
        catch (_) { return null; }
      },
      async set(key, value) {
        try { localStorage.setItem(LS_PREFIX + key, value); } catch (_) {}
        if (!hasBackend) return true;
        try { await writeSheet({ key: key, value: value }); return true; }
        catch (e) { console.warn('[CCS-DR] Sheet write failed:', e.message); return false; }
      },
      async delete(key) {
        try { localStorage.removeItem(LS_PREFIX + key); } catch (_) {}
        if (!hasBackend) return true;
        try { await writeSheet({ key: key, action: 'delete' }); return true; } catch (e) { return false; }
      },
      _hasSharedBackend: hasBackend,
    };
  })();
  window.addEventListener('error', function (ev) {
    console.error('[CCS-DR] Load error:', ev.message, 'at', ev.filename, ev.lineno);
  });
</script>

// POLICY FIDELITY CHECK
// ═══════════════════════════════════════════════════════════════════
function computePolicyFidelity(teamCode, picks) {
  const policy = TEAM_POLICIES[teamCode];
  if (!policy) return null;
  const results = [];
  for (const dec of CASE_0.decisions) {
    const pickedId = picks[dec.key];
    if (!pickedId) continue;
    const opt = dec.options.find(o => o.id === pickedId);
    if (!opt) continue;
    const violations = [];
    if (opt.policyTouches.includes('creation')) {
      const dataExposed = opt.dataExposed || [];
      const humanUsed = opt.humanTaskUsed || [];
      if (dataExposed.some(d => policy.dataNeverIntoAI.includes(d))) violations.push('creation_data');
      if (humanUsed.some(h => policy.humanOnlyTasks.includes(h))) violations.push('creation_human');
    }
    if (opt.policyTouches.includes('transparency') && policy.disclosureRequired) {
      const bypassIds = ['ai_full_auto','ai_spot_check','ai_auto_email','ai_full_resolve','ai_auto_deploy','ai_module'];
      if (bypassIds.includes(opt.id)) violations.push('transparency');
    }
    if (opt.policyTouches.includes('deployment') && !policy.deploymentCheckerBypassAllowed) {
      const bypassIds = ['ai_full_auto','ai_spot_check','ai_auto_email','ai_full_resolve','ai_auto_deploy','ai_module'];
      if (bypassIds.includes(opt.id)) violations.push('deployment');
    }
    results.push({ decisionKey: dec.key, taskLabel: dec.label, pickedId: opt.id, pickedLabel: opt.label, honored: violations.length === 0, violations });
  }
  const honored = results.filter(r => r.honored).length;
  return { total: results.length, honored, violated: results.length - honored, details: results, policy };
}

// LOGIN SCREEN
// ═══════════════════════════════════════════════════════════════════
function LoginScreen({ onLogin, onAdmin }) {
  const [code, setCode] = useState('');
  const [firmName, setFirmName] = useState('');
  const [err, setErr] = useState('');

  function submit() {
    if (!TEAM_CODES.includes(code.trim())) { setErr('Not a valid team code.'); return; }
    const policy = TEAM_POLICIES[code.trim()];
    const name = firmName.trim() || (policy && policy.firm) || '';
    if (!name) { setErr('Enter your firm name.'); return; }
    onLogin(code.trim(), name);
  }

  return (
    <div className="min-h-screen flex flex-col items-center justify-center p-6 ccs-cream">
      <div className="font-body text-xs uppercase tracking-widest ccs-slate mb-3">MGMT 459 · Session 7</div>

      <p className="ccs-slate text-sm mb-10">A soft launch of the Consulting Case Simulator. Teaches the UI; nothing scores.</p>
      <div className="ccs-card-elevated p-6 w-full max-w-md fade-up">
        <label className="block text-xs uppercase tracking-wider ccs-slate font-medium mb-2">Team Code</label>
        <input className="ccs-input mb-4 tabular text-center text-lg" placeholder="4-digit code"
          value={code} onChange={e => setCode(e.target.value)} maxLength={4}
          onKeyDown={e => e.key === 'Enter' && submit()} />
        <label className="block text-xs uppercase tracking-wider ccs-slate font-medium mb-2">Firm Name</label>
        <input className="ccs-input mb-4" placeholder="Your team's firm name"
          value={firmName} onChange={e => setFirmName(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && submit()} />
        {err && <div className="ccs-red text-sm mb-3">{err}</div>}
        <button onClick={submit}
          className="w-full ccs-navy-bg ccs-hover-navy text-white font-medium rounded px-5 py-3 text-sm">Enter</button>

    </div>
  );
}

// DEBRIEF — Policy Fidelity readout
// ═══════════════════════════════════════════════════════════════════
function DebriefScreen({ team, onBackToDashboard }) {
  const fidelity = computePolicyFidelity(team.code, team.picks);
  if (!fidelity) {
    return <div className="min-h-screen flex items-center justify-center ccs-cream">
      <div className="ccs-card p-8">No policy on file for this team.</div>
    </div>;
  }
  const { honored, total, violated, details, policy } = fidelity;
  const fidelityPct = Math.round((honored / total) * 100);
  const scoreTone = fidelityPct >= 80 ? 'ccs-emerald' : fidelityPct >= 50 ? 'ccs-amber' : 'ccs-red';

  const violationLabel = {
    creation_data: 'Creation (data you said never goes into AI)',
    creation_human: 'Creation (task you said stays 100% human)',
    transparency: 'Transparency (disclosure you require was bypassed)',
    deployment: 'Deployment (named checker was bypassed)'
  };

  return (
    <div className="min-h-screen ccs-cream">
      <header className="border-b ccs-border bg-white">
        <div className="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
          <div>
            <div className="text-xs uppercase tracking-widest ccs-slate font-medium">Case 0 · Scaling Sprint · Debrief</div>
            <div className="font-display text-xl ccs-navy" style={{fontWeight: 500}}>Policy Fidelity</div>
          </div>
          <div className="text-right">
            <div className="text-xs ccs-slate uppercase tracking-wider">{team.code}</div>
            <div className="text-sm ccs-navy font-medium">{team.firmName}</div>
          </div>
        </div>
      </header>

      <div className="max-w-4xl mx-auto px-6 py-10 fade-up">
        {policy.policyPending && (
          <div className="ccs-card p-4 mb-6" style={{backgroundColor: '#FEF3C7', borderColor: '#B45309'}}>
            <div className="text-sm ccs-navy"><strong>Note:</strong> Your team's S5 Policy Share-Out hasn't been submitted yet. This fidelity check uses your 4D Charter rules only. Submit your policy for a sharper reading.</div>
          </div>
        )}

        <div className="mb-10 text-center">
          <div className="text-xs uppercase tracking-widest ccs-slate font-medium mb-3">Of your 5 decisions, you honored your written policy on</div>
          <div className={`font-display text-7xl ${scoreTone} tabular mb-2`} style={{fontWeight: 500}}>{honored} <span className="text-3xl ccs-slate">/ {total}</span></div>
          <div className={`text-sm ${scoreTone} font-medium`}>{fidelityPct}% fidelity</div>
        </div>

        <div className="mb-10">
          <h3 className="font-display text-xl ccs-navy mb-4" style={{fontWeight: 500}}>Decision by decision</h3>
          <div className="space-y-3">
            {details.map(r => (
              <div key={r.decisionKey} className="ccs-card p-4">
                <div className="flex items-start gap-3">
                  <div className={`mt-1 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold text-white ${r.honored ? 'ccs-emerald-bg' : 'ccs-red-bg'}`}>
                    {r.honored ? '✓' : '✗'}
                  </div>
                  <div className="flex-1">
                    <div className="text-xs uppercase tracking-wider ccs-slate font-medium mb-1">{r.taskLabel}</div>
                    <div className="text-sm ccs-navy font-medium mb-1">You picked: {r.pickedLabel}</div>
                    {r.honored ? (
                      <div className="text-sm ccs-emerald">Consistent with your policy.</div>
                    ) : (
                      <div className="text-sm ccs-red">
                        <strong>Violates:</strong> {r.violations.map(v => violationLabel[v] || v).join(' · ')}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>

        <div className="mb-10">
          <h3 className="font-display text-xl ccs-navy mb-4" style={{fontWeight: 500}}>Your team's written policy (from Session 5)</h3>
          <div className="ccs-card p-6 space-y-3 text-sm">
            <div><span className="font-medium ccs-navy">Creation:</span> <span className="ccs-slate">{policy.rules.creation}</span></div>
            <div><span className="font-medium ccs-navy">Transparency:</span> <span className="ccs-slate">{policy.rules.transparency}</span></div>
            <div><span className="font-medium ccs-navy">Deployment:</span> <span className="ccs-slate">{policy.rules.deployment}</span></div>
            <div><span className="font-medium ccs-navy">Diligence:</span> <span className="ccs-slate">{policy.rules.diligence}</span></div>
            <div className="pt-3 border-t ccs-border">
              <div><span className="font-medium ccs-navy">Named checker:</span> <span className="ccs-slate">{policy.namedChecker}</span></div>
              <div className="mt-1"><span className="font-medium ccs-navy">Client disclosure:</span> <span className="ccs-slate italic">{policy.disclosureText}</span></div>
              <div className="mt-1"><span className="font-medium ccs-navy">Strongest rule:</span> <span className="ccs-slate">{policy.strongestRule}</span></div>
            </div>
          </div>
        </div>

        {policy.whereDisagreed && !policy.whereDisagreed.startsWith('No ') && !policy.whereDisagreed.startsWith('(TBD') && (

          <div className="text-xs ccs-slate">Case 0 complete. Cases 1-3 will unlock when the instructor releases them.</div>
        </div>
      </div>
    </div>
  );
}

            <thead>
              <tr className="text-xs uppercase tracking-wider ccs-slate border-b ccs-border">
                <th className="text-left pb-2 font-medium">Code</th>
                <th className="text-left pb-2 font-medium">Firm</th>
                <th className="text-left pb-2 font-medium">Status</th>
                <th className="text-right pb-2 font-medium">Fidelity</th>
              </tr>
            </thead>
            <tbody>
              {data.teams.map(t => {
                const picksCount = Object.keys(t.picks || {}).length;
                const fid = t.completed ? computePolicyFidelity(t.code, t.picks) : null;
                return (
                  <tr key={t.code} className="border-b ccs-border">
                    <td className="py-3 tabular ccs-navy font-medium">{t.code}</td>
                    <td className="py-3 ccs-navy">{t.firmName || TEAM_POLICIES[t.code]?.firm || '—'}</td>
                    <td className="py-3">
                      {t.completed ? <span className="ccs-emerald text-xs font-semibold uppercase tracking-wider">Complete</span> :
                       picksCount > 0 ? <span className="ccs-amber text-xs font-semibold uppercase tracking-wider">In progress ({picksCount}/5)</span> :
                       <span className="ccs-slate text-xs uppercase tracking-wider">Not started</span>}
                    </td>
                    <td className="py-3 text-right">
                      {fid ? <span className={`font-medium tabular ${fid.honored === fid.total ? 'ccs-emerald' : fid.honored >= fid.total/2 ? 'ccs-amber' : 'ccs-red'}`}>{fid.honored}/{fid.total}</span> : <span className="ccs-slate">—</span>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          </div>
        </div>

        <div className="ccs-card p-6 border-l-4" style={{borderLeftColor: '#B91C1C'}}>
          <div className="text-xs uppercase tracking-wider ccs-red font-semibold mb-2">Reset</div>
          <p className="text-sm ccs-slate mb-3">Wipes all team picks and completion status. Use between class sections.</p>
          <button onClick={() => { if (confirm('Reset all Scaling Sprint data for all teams?')) onResetAll(); }}
            className="px-4 py-2 rounded text-sm font-medium bg-white ccs-red border" style={{borderColor: '#B91C1C'}}>Reset All Data</button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════════
function App() {
  const [data, setData] = useState(null);
  const [view, setView] = useState('login');  // login | admin | dashboard | brief | decisions | debrief
  const [team, setTeam] = useState(null);
  const [picks, setPicks] = useState({});

  useEffect(() => { boot(); }, []);

  async function boot() {
    const d = await loadData();
    if (d) setData(d);
    else { const fresh = createInitialState(); await saveData(fresh); setData(fresh); }
    const boot = document.getElementById('boot'); if (boot) { boot.classList.add('hidden'); setTimeout(() => boot.remove(), 400); }
    // Poll
    setInterval(async () => {
      const latest = await loadData();
      if (latest) setData(cur => JSON.stringify(cur) === JSON.stringify(latest) ? cur : latest);
    }, (window.CCS_CONFIG && window.CCS_CONFIG.POLL_SECONDS || 10) * 1000);
  }

  if (!data) return <div />;

  async function handleLogin(code, firmName) {
    const t = data.teams.find(x => x.code === code);
    if (!t) return;
    const updatedTeam = { ...t, firmName };
    const newData = { ...data, teams: data.teams.map(x => x.code === code ? updatedTeam : x) };
    await saveData(newData); setData(newData);
    setTeam(updatedTeam);
    setPicks(updatedTeam.picks || {});
    setView('dashboard');
  }

  async function handleReleaseToggle() {
    const newData = { ...data, released: !data.released };
    await saveData(newData); setData(newData);
  }
  async function handleResetAll() {
    const fresh = createInitialState();
    await saveData(fresh); setData(fresh);
  }
  async function handleSubmit() {
    const newTeam = { ...team, picks, completed: true, completedAt: new Date().toISOString() };
    const newData = { ...data, teams: data.teams.map(x => x.code === team.code ? newTeam : x) };
    await saveData(newData); setData(newData); setTeam(newTeam);
    setView('debrief');
  }

  function logout() { setTeam(null); setPicks({}); setView('login'); }

  return (
    <React.Fragment>
      <StyleInjection />
      {view === 'login' && <LoginScreen onLogin={handleLogin} onAdmin={() => setView('admin')} />}
      {view === 'admin' && <AdminScreen data={data} onReleaseToggle={handleReleaseToggle} onLogout={logout} onResetAll={handleResetAll} />}
      {view === 'dashboard' && team && <Dashboard data={data} team={team}
        onBegin={() => setView('brief')}
        onReviewDebrief={() => setView('debrief')}
        onLogout={logout} />}
      {view === 'brief' && team && <BriefScreen team={team}
        onContinue={() => setView('decisions')}
        onBack={() => setView('dashboard')} />}
      {view === 'decisions' && team && <DecisionsScreen team={team} picks={picks} setPicks={setPicks}
        onSubmit={handleSubmit}
        onBack={() => setView('brief')} />}
      {view === 'debrief' && team && <DebriefScreen team={team}
        onBackToDashboard={() => setView('dashboard')} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
