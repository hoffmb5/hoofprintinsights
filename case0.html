<script>
  // ============ window.storage shim — Google Sheets backend ============
  (function () {
    const LS_PREFIX = 'ccs-dr::';
    const cfg = window.CCS_CONFIG || {};
    const url = (cfg.SHEETS_URL || '').trim();
    const hasBackend = url && url.startsWith('http');
    if (!hasBackend) document.getElementById('config-banner').classList.add('show');

    async function readSheet(key) {
      const resp = await fetch(url + '?key=' + encodeURIComponent(key), { method: 'GET', redirect: 'follow' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return await resp.text();
    }
    async function writeSheet(payload) {
      await fetch(url, {
        method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload),
      });
    }

    window.storage = {
      async get(key) {
        if (hasBackend) {
          try {
            const text = await readSheet(key);
            if (text) { try { localStorage.setItem(LS_PREFIX + key, text); } catch (_) {} return { value: text }; }
          } catch (e) { console.warn('[CCS-DR] Sheet read failed:', e.message); }
        }
        try { const raw = localStorage.getItem(LS_PREFIX + key); return raw ? { value: raw } : null; }
        catch (_) { return null; }
      },
      async set(key, value) {
        try { localStorage.setItem(LS_PREFIX + key, value); } catch (_) {}
        if (!hasBackend) return true;
        try { await writeSheet({ key: key, value: value }); return true; }
        catch (e) { console.warn('[CCS-DR] Sheet write failed:', e.message); return false; }
      },
      async delete(key) {
        try { localStorage.removeItem(LS_PREFIX + key); } catch (_) {}
        if (!hasBackend) return true;
        try { await writeSheet({ key: key, action: 'delete' }); return true; } catch (e) { return false; }
      },
      _hasSharedBackend: hasBackend,
    };
  })();
  window.addEventListener('error', function (ev) {
    console.error('[CCS-DR] Load error:', ev.message, 'at', ev.filename, ev.lineno);
  });
</script>

// Returns the ACTIVE policy for a team — merges baseline (TEAM_POLICIES) with
// any revised fields the team saved in their revisedPolicy snapshot.
function getActivePolicy(teamCode, team) {
  const baseline = TEAM_POLICIES[teamCode];
  if (!baseline) return null;
  const rev = team && team.revisedPolicy;
  if (!rev) return baseline;
  return {
    ...baseline,
    dataNeverIntoAI: rev.dataNeverIntoAI,
    humanOnlyTasks: rev.humanOnlyTasks,
    disclosureRequired: rev.disclosureRequired,
    // Context fields: fall back to baseline if the revision didn't set them
    namedChecker: (rev.namedChecker != null && rev.namedChecker !== '') ? rev.namedChecker : baseline.namedChecker,
    disclosureText: (rev.disclosureText != null && rev.disclosureText !== '') ? rev.disclosureText : baseline.disclosureText,
    _hasRevisions: true,
  };
}

// Preview — given a candidate policy, count how many options across all 5 decisions
// would violate it, broken down by rule type and distinct decisions affected.
function previewImpact(policy) {
  const counts = { creation: 0, transparency: 0, deployment: 0, totalOptions: 0, decisionsAffected: 0 };
  const affected = new Set();
  for (const dec of CASE_0.decisions) {
    for (const opt of dec.options) {
      let hit = false;
      if (opt.policyTouches.includes('creation')) {
        const dataExposed = opt.dataExposed || [];
        const humanUsed = opt.humanTaskUsed || [];
        if (dataExposed.some(d => policy.dataNeverIntoAI.includes(d))) { counts.creation++; hit = true; }
        if (humanUsed.some(h => policy.humanOnlyTasks.includes(h))) { counts.creation++; hit = true; }
      }
      if (opt.policyTouches.includes('transparency') && policy.disclosureRequired &&
          BYPASS_OPTION_IDS.includes(opt.id)) { counts.transparency++; hit = true; }
      if (opt.policyTouches.includes('deployment') && !policy.deploymentCheckerBypassAllowed &&
          BYPASS_OPTION_IDS.includes(opt.id)) { counts.deployment++; hit = true; }
      if (hit) { counts.totalOptions++; affected.add(dec.key); }
    }
  }
  counts.decisionsAffected = affected.size;
  return counts;
}

// POLICY FIDELITY CHECK — uses active policy (baseline or revised)
// ═══════════════════════════════════════════════════════════════════
function computePolicyFidelity(teamCode, picks, team) {
  const policy = getActivePolicy(teamCode, team);
  if (!policy) return null;
  const results = [];
  for (const dec of CASE_0.decisions) {
    const pickedId = picks[dec.key];
    if (!pickedId) continue;
    const opt = dec.options.find(o => o.id === pickedId);
    if (!opt) continue;
    const violations = [];
    if (opt.policyTouches.includes('creation')) {
      const dataExposed = opt.dataExposed || [];
      const humanUsed = opt.humanTaskUsed || [];
      if (dataExposed.some(d => policy.dataNeverIntoAI.includes(d))) violations.push('creation_data');
      if (humanUsed.some(h => policy.humanOnlyTasks.includes(h))) violations.push('creation_human');
    }
    if (opt.policyTouches.includes('transparency') && policy.disclosureRequired) {
      if (BYPASS_OPTION_IDS.includes(opt.id)) violations.push('transparency');
    }
    if (opt.policyTouches.includes('deployment') && !policy.deploymentCheckerBypassAllowed) {
      if (BYPASS_OPTION_IDS.includes(opt.id)) violations.push('deployment');
    }
    results.push({ decisionKey: dec.key, taskLabel: dec.label, pickedId: opt.id, pickedLabel: opt.label, honored: violations.length === 0, violations });
  }
  const honored = results.filter(r => r.honored).length;
  return { total: results.length, honored, violated: results.length - honored, details: results, policy, hasRevisions: !!policy._hasRevisions };
}

async function loadData() {

  return null;
}

  const [taskSet, setTaskSet] = useState(new Set((existing ? existing.humanOnlyTasks : baseline.humanOnlyTasks) || []));

    const next = new Set(dataSet);
    if (next.has(tag)) next.delete(tag); else next.add(tag);
    setDataSet(next);
  }
  function toggleTask(tag) {
    const next = new Set(taskSet);
    if (next.has(tag)) next.delete(tag); else next.add(tag);
    setTaskSet(next);
  }

  const candidatePolicy = {
    dataNeverIntoAI: Array.from(dataSet),

    disclosureRequired: disclosure,

          <div className="text-xs uppercase tracking-wider ccs-slate font-medium mb-1">Variable 3</div>
          <h2 className="font-display text-xl ccs-navy mb-1" style={{fontWeight: 500}}>Require disclosure on every AI-touched client interaction?</h2>
          <p className="text-xs ccs-slate mb-4">Hard switch — one or the other. No in-between.</p>
          <div className="space-y-2">
            <label className="flex items-center gap-3 p-3 ccs-card cursor-pointer hover:bg-slate-50">
              <input type="radio" name="disclosure" checked={disclosure === true} onChange={() => setDisclosure(true)}
                style={{width: '18px', height: '18px', accentColor: '#0F1729'}} />
              <div>
                <div className="text-sm font-medium ccs-navy">Yes — always</div>
                <div className="text-xs ccs-slate">Every client-facing AI-touched output must have disclosure baked in.</div>
              </div>
            </label>
            <label className="flex items-center gap-3 p-3 ccs-card cursor-pointer hover:bg-slate-50">
              <input type="radio" name="disclosure" checked={disclosure === false} onChange={() => setDisclosure(false)}
                style={{width: '18px', height: '18px', accentColor: '#0F1729'}} />
              <div>
                <div className="text-sm font-medium ccs-navy">No — only when asked</div>
                <div className="text-xs ccs-slate">The team discloses AI use only if the client asks.</div>
              </div>
            </label>
          </div>
        </div>

        {/* Preview Impact */}
        <div className="ccs-card-elevated p-6 mb-6" style={{backgroundColor:'#F5F4EE', borderColor:'#B45309'}}>
          <div className="text-xs uppercase tracking-wider font-semibold mb-2" style={{color:'#B45309'}}>📊 Preview Impact</div>
          <div className="text-sm ccs-navy mb-3">
            With these settings, <strong>{impact.decisionsAffected} of {CASE_0.decisions.length} decisions</strong> have options that would violate your policy. (Which options? That's for you to figure out when you run the Sprint.)
          </div>
          <div className="grid grid-cols-3 gap-3 text-center">
            <div className="ccs-card p-3">
              <div className="text-xs uppercase tracking-wider ccs-slate">Creation</div>
              <div className="font-display text-2xl ccs-navy tabular" style={{fontWeight: 500}}>{impact.creation}</div>
              <div className="text-xs ccs-slate">option-violations</div>
            </div>
            <div className="ccs-card p-3">
              <div className="text-xs uppercase tracking-wider ccs-slate">Transparency</div>
              <div className="font-display text-2xl ccs-navy tabular" style={{fontWeight: 500}}>{impact.transparency}</div>
              <div className="text-xs ccs-slate">option-violations</div>
            </div>
            <div className="ccs-card p-3">
              <div className="text-xs uppercase tracking-wider ccs-slate">Deployment</div>
              <div className="font-display text-2xl ccs-navy tabular" style={{fontWeight: 500}}>{impact.deployment}</div>
              <div className="text-xs ccs-slate">option-violations</div>
            </div>
          </div>
        </div>

        {/* CONTEXT (optional — doesn't change your score) */}
        <div className="ccs-card-elevated p-6 mb-6">
          <div className="text-xs uppercase tracking-wider ccs-slate font-medium mb-1">Context fields <span className="ccs-amber">· optional</span></div>
          <h2 className="font-display text-xl ccs-navy mb-1" style={{fontWeight: 500}}>Make your policy specific.</h2>
          <p className="text-xs ccs-slate mb-5">These two fields personalize your debrief and persona card. They don't change your fidelity score — they just make the policy feel like yours.</p>

          <div className="mb-5">
            <label className="block text-xs uppercase tracking-wider ccs-slate font-medium mb-2">Named checker</label>
            <p className="text-xs ccs-slate mb-2">Who on your team is responsible for reviewing client-facing output before it ships? Name a person, or say "entire team" if that's your rule.</p>
            <input className="ccs-input" placeholder="e.g. Morgan · or 'Entire team'"
              value={namedChecker} onChange={e => setNamedChecker(e.target.value)}
              maxLength={120} />
          </div>

          <div>
            <label className="block text-xs uppercase tracking-wider ccs-slate font-medium mb-2">Our client disclosure — the exact words</label>
            <p className="text-xs ccs-slate mb-2">If you set Variable 3 to "Yes," this is what you'd actually say to the client. Write the sentence you want attached to AI-assisted output.</p>
            <textarea className="ccs-input" rows={3}
              placeholder={`e.g. "This output was AI-assisted and reviewed by [name] before being sent to you."`}
              value={disclosureText} onChange={e => setDisclosureText(e.target.value)}
              maxLength={400}
              style={{resize: 'vertical', minHeight: '72px', fontFamily: 'inherit'}} />
            <div className="text-xs ccs-slate mt-1 tabular">{disclosureText.length} / 400</div>
          </div>
        </div>

        <div className="flex items-center justify-between pt-4 border-t ccs-border">
          <button onClick={onCancel} className="text-sm ccs-slate hover:ccs-navy">← Cancel (keep current)</button>
          <button onClick={save} disabled={!changedFromBaseline && !startFromRevised}
            className={`px-6 py-3 rounded font-medium text-sm ${(changedFromBaseline || startFromRevised) ? 'ccs-navy-bg ccs-hover-navy text-white' : 'bg-slate-200 ccs-slate cursor-not-allowed'}`}>
            Save Revisions
          </button>
        </div>
      </div>
    </div>
  );
}

// DEBRIEF — Policy Fidelity readout
// ═══════════════════════════════════════════════════════════════════
function DebriefScreen({ team, onBackToDashboard }) {
  const fidelity = computePolicyFidelity(team.code, team.picks, team);
  if (!fidelity) {
    return <div className="min-h-screen flex items-center justify-center ccs-cream">
      <div className="ccs-card p-8">No policy on file for this team.</div>
    </div>;
  }
  const { honored, total, violated, details, policy } = fidelity;
  const fidelityPct = Math.round((honored / total) * 100);
  const scoreTone = fidelityPct >= 80 ? 'ccs-emerald' : fidelityPct >= 50 ? 'ccs-amber' : 'ccs-red';

  const violationLabel = {
    creation_data: 'Creation (data you said never goes into AI)',
    creation_human: 'Creation (task you said stays 100% human)',
    transparency: 'Transparency (disclosure you require was bypassed)',
    deployment: 'Deployment (named checker was bypassed)'
  };

  return (
    <div className="min-h-screen ccs-cream">
      <header className="border-b ccs-border bg-white">
        <div className="max-w-4xl mx-auto px-6 py-4 flex items-center justify-between">
          <div>
            <div className="text-xs uppercase tracking-widest ccs-slate font-medium">Case 0 · Scaling Sprint · Debrief</div>
            <div className="font-display text-xl ccs-navy" style={{fontWeight: 500}}>Policy Fidelity</div>
          </div>
          <div className="text-right">
            <div className="text-xs ccs-slate uppercase tracking-wider">{team.code}</div>
            <div className="text-sm ccs-navy font-medium">{team.firmName}</div>
          </div>
        </div>
      </header>

      <div className="max-w-4xl mx-auto px-6 py-10 fade-up">
        {policy.policyPending && (
          <div className="ccs-card p-4 mb-6" style={{backgroundColor: '#FEF3C7', borderColor: '#B45309'}}>
            <div className="text-sm ccs-navy"><strong>Note:</strong> Your team's S5 Policy Share-Out hasn't been submitted yet. This fidelity check uses your 4D Charter rules only. Submit your policy for a sharper reading.</div>
          </div>
        )}
        {fidelity.hasRevisions && (
          <div className="ccs-card p-4 mb-6" style={{backgroundColor: '#F0E6D2', borderLeftWidth: '4px', borderLeftColor: '#B45309'}}>
            <div className="text-xs uppercase tracking-wider font-semibold mb-1" style={{color: '#B45309'}}>Scored against your REVISED policy</div>
            <div className="text-sm ccs-navy">
              This fidelity check uses the revisions your team saved {team.revisedAt ? `on ${new Date(team.revisedAt).toLocaleString()}` : ''}.
              Your Session 5 baseline is preserved — your instructor can compare before vs after.
            </div>
          </div>
        )}

        <div className="mb-10 text-center">
          <div className="text-xs uppercase tracking-widest ccs-slate font-medium mb-3">Of your 5 decisions, you honored your written policy on</div>
          <div className={`font-display text-7xl ${scoreTone} tabular mb-2`} style={{fontWeight: 500}}>{honored} <span className="text-3xl ccs-slate">/ {total}</span></div>
          <div className={`text-sm ${scoreTone} font-medium`}>{fidelityPct}% fidelity</div>
        </div>

        <div className="mb-10">
          <h3 className="font-display text-xl ccs-navy mb-4" style={{fontWeight: 500}}>Decision by decision</h3>
          <div className="space-y-3">
            {details.map(r => (
              <div key={r.decisionKey} className="ccs-card p-4">
                <div className="flex items-start gap-3">
                  <div className={`mt-1 w-6 h-6 rounded-full flex items-center justify-center text-xs font-bold text-white ${r.honored ? 'ccs-emerald-bg' : 'ccs-red-bg'}`}>
                    {r.honored ? '✓' : '✗'}
                  </div>
                  <div className="flex-1">
                    <div className="text-xs uppercase tracking-wider ccs-slate font-medium mb-1">{r.taskLabel}</div>
                    <div className="text-sm ccs-navy font-medium mb-1">You picked: {r.pickedLabel}</div>
                    {r.honored ? (
                      <div className="text-sm ccs-emerald">Consistent with your policy.</div>
                    ) : (
                      <div className="text-sm ccs-red">
                        <strong>Violates:</strong> {r.violations.map(v => violationLabel[v] || v).join(' · ')}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>

        <div className="mb-10">
          <h3 className="font-display text-xl ccs-navy mb-4" style={{fontWeight: 500}}>Your team's written policy (from Session 5)</h3>
          <div className="ccs-card p-6 space-y-3 text-sm">
            <div><span className="font-medium ccs-navy">Creation:</span> <span className="ccs-slate">{policy.rules.creation}</span></div>
            <div><span className="font-medium ccs-navy">Transparency:</span> <span className="ccs-slate">{policy.rules.transparency}</span></div>
            <div><span className="font-medium ccs-navy">Deployment:</span> <span className="ccs-slate">{policy.rules.deployment}</span></div>
            <div><span className="font-medium ccs-navy">Diligence:</span> <span className="ccs-slate">{policy.rules.diligence}</span></div>
            <div className="pt-3 border-t ccs-border">
              <div><span className="font-medium ccs-navy">Named checker:</span> <span className="ccs-slate">{policy.namedChecker}</span></div>
              <div className="mt-1"><span className="font-medium ccs-navy">Client disclosure:</span> <span className="ccs-slate italic">{policy.disclosureText}</span></div>
              <div className="mt-1"><span className="font-medium ccs-navy">Strongest rule:</span> <span className="ccs-slate">{policy.strongestRule}</span></div>
            </div>
          </div>
        </div>

        {policy.whereDisagreed && !policy.whereDisagreed.startsWith('No ') && !policy.whereDisagreed.startsWith('(TBD') && (
          <div className="mb-10">
            <div className="ccs-card p-6" style={{backgroundColor: '#F0E6D2'}}>
              <div className="text-xs uppercase tracking-wider ccs-amber font-semibold mb-2">Where your team flagged a tension in share-out</div>
              <p className="text-sm ccs-navy italic">"{policy.whereDisagreed}"</p>
              <p className="text-xs ccs-slate mt-2">Did your choices today reflect how that tension actually plays out under pressure?</p>
            </div>
          </div>
        )}

        <div className="flex items-center justify-between pt-6 border-t ccs-border">
          <button onClick={onBackToDashboard} className="text-sm ccs-slate hover:ccs-navy">← Dashboard</button>
          <div className="text-xs ccs-slate">Case 0 complete. Cases 1-3 will unlock when the instructor releases them.</div>
        </div>
      </div>
    </div>
  );
}

// ADMIN CONSOLE
// ═══════════════════════════════════════════════════════════════════
function AdminScreen({ data, onReleaseToggle, onLogout, onResetAll, onPolicyEditToggle, onAdminEditTeam, onAdminResetTeam }) {
  const [pw, setPw] = useState('');
  const [auth, setAuth] = useState(false);
  const [err, setErr] = useState('');
  const [tab, setTab] = useState('status');
  const [expanded, setExpanded] = useState({});

  if (!auth) {
    return (
      <div className="min-h-screen flex flex-col items-center justify-center p-6 ccs-cream">
        <div className="font-body text-xs uppercase tracking-widest ccs-slate mb-3">Instructor</div>
        <h1 className="font-display text-3xl ccs-navy mb-6" style={{fontWeight: 500}}>Admin Console</h1>
        <div className="ccs-card-elevated p-6 w-full max-w-sm">
          <label className="block text-xs uppercase tracking-wider ccs-slate font-medium mb-2">Password</label>
          <input type="password" className="ccs-input mb-4" value={pw}
            onChange={e => setPw(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && (pw === ADMIN_PASSWORD ? setAuth(true) : setErr('Incorrect.'))} />
          {err && <div className="ccs-red text-sm mb-3">{err}</div>}
          <button onClick={() => pw === ADMIN_PASSWORD ? setAuth(true) : setErr('Incorrect.')}
            className="w-full ccs-navy-bg ccs-hover-navy text-white font-medium rounded px-5 py-3 text-sm">Enter</button>
          <button onClick={onLogout} className="w-full mt-3 ccs-slate text-xs uppercase tracking-widest hover:ccs-navy">Back to team login</button>
        </div>
      </div>
    );
  }

  const completed = data.teams.filter(t => t.completed);
  const notStarted = data.teams.filter(t => !t.completed && Object.keys(t.picks || {}).length === 0);
  const inProgress = data.teams.filter(t => !t.completed && Object.keys(t.picks || {}).length > 0);

  function toggleTeam(code) {
    setExpanded(prev => ({ ...prev, [code]: !prev[code] }));
  }

  function violationLabel(v) {
    return v === 'creation_data' ? 'Creation (data)' :
           v === 'creation_human' ? 'Creation (human-only task)' :
           v === 'transparency' ? 'Transparency (disclosure bypassed)' :
           v === 'deployment' ? 'Deployment (checker bypassed)' : v;
  }

  return (
    <div className="min-h-screen ccs-cream">
      <header className="border-b ccs-border bg-white">
        <div className="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
          <div>
            <div className="text-xs uppercase tracking-widest ccs-slate font-medium">MGMT 459 · Instructor</div>
            <div className="font-display text-xl ccs-navy" style={{fontWeight: 500}}>Scaling Sprint — Admin</div>
          </div>
          <button onClick={onLogout} className="text-xs ccs-slate uppercase tracking-widest hover:ccs-navy">Log Out</button>
        </div>
        <div className="max-w-6xl mx-auto px-6 flex gap-6 border-t ccs-border">
          <button onClick={() => setTab('status')}
            className={`py-3 text-sm font-medium`}
            style={{color: tab === 'status' ? '#0F1729' : '#475569', borderBottom: tab === 'status' ? '2px solid #0F1729' : '2px solid transparent'}}>
            Status & Release
          </button>
          <button onClick={() => setTab('cheat')}
            className={`py-3 text-sm font-medium`}
            style={{color: tab === 'cheat' ? '#0F1729' : '#475569', borderBottom: tab === 'cheat' ? '2px solid #0F1729' : '2px solid transparent'}}>
            Instructor Cheat Sheet
          </button>
        </div>
      </header>

      {tab === 'status' && (
      <div className="max-w-6xl mx-auto px-6 py-10 fade-up space-y-8">
        <div className="ccs-card-elevated p-6">
          <h2 className="font-display text-2xl ccs-navy mb-1" style={{fontWeight: 500}}>Release the Scaling Sprint</h2>
          <p className="text-sm ccs-slate mb-4">Teams see "Locked" on their dashboard until released. Once released, they can log in and complete Case 0 immediately.</p>
          <div className="flex items-center gap-4">
            <div className={`px-4 py-2 rounded text-sm font-medium ${data.released ? 'ccs-emerald-bg text-white' : 'bg-slate-200 ccs-slate'}`}>
              {data.released ? 'RELEASED' : 'LOCKED'}
            </div>
            <button onClick={onReleaseToggle}
              className={`px-5 py-2.5 rounded text-sm font-medium ${data.released ? 'bg-white ccs-navy border ccs-border hover:bg-slate-50' : 'ccs-emerald-bg ccs-hover-emerald text-white'}`}>
              {data.released ? 'Lock the Sprint' : 'Release the Sprint'}
            </button>
          </div>
        </div>

        <div className="ccs-card-elevated p-6" style={{borderLeftWidth: '4px', borderLeftColor: '#B45309'}}>
          <h2 className="font-display text-2xl ccs-navy mb-1" style={{fontWeight: 500}}>Policy Editing</h2>
          <p className="text-sm ccs-slate mb-4">When unlocked, teams see a "Revise Policy" button on their dashboard and can edit the three simulator variables directly. Baseline is always preserved for before/after comparison.</p>
          <div className="flex items-center gap-4">
            <div className={`px-4 py-2 rounded text-sm font-medium`}
              style={{backgroundColor: data.policyEditingUnlocked ? '#B45309' : '#E2E8F0',
                      color: data.policyEditingUnlocked ? 'white' : '#475569'}}>
              {data.policyEditingUnlocked ? 'UNLOCKED — teams can revise' : 'LOCKED — teams cannot revise'}
            </div>
            <button onClick={onPolicyEditToggle}
              className={`px-5 py-2.5 rounded text-sm font-medium ${data.policyEditingUnlocked ? 'bg-white ccs-navy border ccs-border hover:bg-slate-50' : 'text-white'}`}
              style={!data.policyEditingUnlocked ? {backgroundColor: '#B45309'} : {}}>
              {data.policyEditingUnlocked ? 'Lock Editing' : 'Unlock Editing'}
            </button>
          </div>
        </div>

        <div className="grid grid-cols-3 gap-4">
          <div className="ccs-card p-5">
            <div className="text-xs uppercase tracking-wider ccs-slate font-medium mb-2">Completed</div>
            <div className="font-display text-3xl ccs-navy tabular" style={{fontWeight: 500}}>{completed.length}</div>
            <div className="text-xs ccs-slate">of {data.teams.length} teams</div>
          </div>
          <div className="ccs-card p-5">
            <div className="text-xs uppercase tracking-wider ccs-slate font-medium mb-2">In Progress</div>
            <div className="font-display text-3xl ccs-amber tabular" style={{fontWeight: 500}}>{inProgress.length}</div>
            <div className="text-xs ccs-slate">started but not submitted</div>
          </div>
          <div className="ccs-card p-5">
            <div className="text-xs uppercase tracking-wider ccs-slate font-medium mb-2">Not Started</div>
            <div className="font-display text-3xl ccs-slate tabular" style={{fontWeight: 500}}>{notStarted.length}</div>
            <div className="text-xs ccs-slate">haven't opened Case 0</div>
          </div>
        </div>

        <div className="ccs-card-elevated p-6">
          <h3 className="font-display text-xl ccs-navy mb-4" style={{fontWeight: 500}}>Team Status</h3>
          <p className="text-xs ccs-slate mb-3">Fidelity now shows a score whenever a team has made all 5 picks — even if they haven't hit the final Submit yet (so you can see draft scores).</p>
          <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="text-xs uppercase tracking-wider ccs-slate border-b ccs-border">
                <th className="text-left pb-2 font-medium">Code</th>
                <th className="text-left pb-2 font-medium">Firm</th>
                <th className="text-left pb-2 font-medium">Status</th>
                <th className="text-right pb-2 font-medium">Fidelity</th>
              </tr>
            </thead>
            <tbody>
              {data.teams.map(t => {
                const picksCount = Object.keys(t.picks || {}).length;
                // Compute fidelity whenever all 5 picks are made (not just when "completed")
                const fid = picksCount >= 5 ? computePolicyFidelity(t.code, t.picks) : null;
                return (
                  <tr key={t.code} className="border-b ccs-border">
                    <td className="py-3 tabular ccs-navy font-medium">{t.code}</td>
                    <td className="py-3 ccs-navy">{t.firmName || TEAM_POLICIES[t.code]?.firm || '—'}</td>
                    <td className="py-3">
                      {t.completed ? <span className="ccs-emerald text-xs font-semibold uppercase tracking-wider">Complete</span> :
                       picksCount >= 5 ? <span className="ccs-amber text-xs font-semibold uppercase tracking-wider">Picked all · not submitted</span> :
                       picksCount > 0 ? <span className="ccs-amber text-xs font-semibold uppercase tracking-wider">In progress ({picksCount}/5)</span> :
                       <span className="ccs-slate text-xs uppercase tracking-wider">Not started</span>}
                    </td>
                    <td className="py-3 text-right">
                      {fid ? (
                        <span className={`font-medium tabular ${fid.honored === fid.total ? 'ccs-emerald' : fid.honored >= fid.total/2 ? 'ccs-amber' : 'ccs-red'}`}>
                          {fid.honored}/{fid.total}{!t.completed && <span className="ccs-slate text-xs ml-1">(draft)</span>}

                      ) : <span className="ccs-slate">—</span>}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          </div>
        </div>

        <div className="ccs-card p-6 border-l-4" style={{borderLeftColor: '#B91C1C'}}>
          <div className="text-xs uppercase tracking-wider ccs-red font-semibold mb-2">Reset</div>
          <p className="text-sm ccs-slate mb-3">Wipes all team picks and completion status. Use between class sections.</p>
          <button onClick={() => { if (confirm('Reset all Scaling Sprint data for all teams?')) onResetAll(); }}
            className="px-4 py-2 rounded text-sm font-medium bg-white ccs-red border" style={{borderColor: '#B91C1C'}}>Reset All Data</button>
        </div>
      </div>
      )}

      {tab === 'cheat' && (
      <div className="max-w-6xl mx-auto px-6 py-10 fade-up space-y-6">
        <div className="ccs-card p-5">
          <h2 className="font-display text-xl ccs-navy mb-1" style={{fontWeight: 500}}>Instructor Cheat Sheet</h2>
          <p className="text-sm ccs-slate">Everything the simulator knows about each team — their policy, their picks, and exactly which rule each option touches. Click a team to expand. Use the Case 0 Reference at the top to answer "what would happen if we picked X?"</p>
        </div>

        {/* CASE 0 REFERENCE */}
        <details className="ccs-card-elevated p-5">
          <summary className="cursor-pointer font-display text-lg ccs-navy font-medium" style={{fontWeight: 500}}>Case 0 Reference — all 5 decisions × 4 options with system tags</summary>
          <div className="mt-4 space-y-5">
            {CASE_0.decisions.map(dec => (
              <div key={dec.key}>
                <div className="text-xs uppercase tracking-wider ccs-slate font-medium mb-1">Task {dec.taskNumber}</div>
                <div className="font-medium ccs-navy mb-2">{dec.label.replace(`Task ${dec.taskNumber} — `, '')}</div>
                <div className="text-xs ccs-slate italic mb-3">{dec.prompt}</div>
                <div className="space-y-2">

                    <div key={opt.id} className="ccs-card p-3">

                        <div className="text-xs ccs-slate tabular whitespace-nowrap font-mono">{opt.id}</div>

                      <div className="text-xs ccs-slate mb-2">{opt.summary}</div>

                          <span className="px-2 py-0.5 rounded bg-slate-100 ccs-slate">no policy touches — "safe" baseline</span>
                        ) : opt.policyTouches.map(t => (
                          <span key={t} className="px-2 py-0.5 rounded font-medium" style={{backgroundColor:'#FEF3C7', color:'#B45309'}}>{t}</span>
                        ))}
                        {opt.dataExposed && opt.dataExposed.map(d => (
                          <span key={'d'+d} className="px-2 py-0.5 rounded font-mono" style={{backgroundColor:'#FEE2E2', color:'#B91C1C'}}>data: {d}</span>
                        ))}
                        {opt.humanTaskUsed && opt.humanTaskUsed.map(h => (
                          <span key={'h'+h} className="px-2 py-0.5 rounded font-mono" style={{backgroundColor:'#FEE2E2', color:'#B91C1C'}}>task: {h}</span>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </details>

        {/* PER-TEAM CARDS */}
        {data.teams.map(t => {
          const baseline = TEAM_POLICIES[t.code];
          const policy = getActivePolicy(t.code, t);
          const hasRevisions = !!(t.revisedPolicy);
          const picksCount = Object.keys(t.picks || {}).length;
          const fid = picksCount >= 5 ? computePolicyFidelity(t.code, t.picks, t) : null;
          const isExpanded = expanded[t.code];
          const status = t.completed ? 'Complete' : picksCount >= 5 ? 'Picked all · not submitted' : picksCount > 0 ? `In progress (${picksCount}/5)` : 'Not started';
          const statusColor = t.completed ? 'ccs-emerald' : picksCount >= 5 ? 'ccs-amber' : picksCount > 0 ? 'ccs-amber' : 'ccs-slate';

          return (
            <div key={t.code} className="ccs-card-elevated">
              <div onClick={() => toggleTeam(t.code)} className="p-5 cursor-pointer hover:bg-slate-50 flex items-center gap-4">
                <div className="ccs-slate font-mono text-lg">{isExpanded ? '▼' : '▶'}</div>
                <div className="w-16 tabular ccs-navy font-medium">{t.code}</div>
                <div className="flex-1">
                  <div className="font-display text-lg ccs-navy" style={{fontWeight: 500}}>{t.firmName || policy?.firm}</div>
                  <div className="text-xs ccs-slate">{policy?.firm && t.firmName && t.firmName !== policy.firm ? `(logged in as "${t.firmName}")` : ''}</div>
                </div>
                <div className={`text-xs font-semibold uppercase tracking-wider ${statusColor}`}>{status}</div>
                {hasRevisions && (
                  <div className="text-xs font-semibold uppercase tracking-wider px-2 py-1 rounded"
                       style={{backgroundColor: '#FEF3C7', color: '#B45309'}}>Revised</div>
                )}
                {fid && (
                  <div className={`font-display text-xl tabular ${fid.honored === fid.total ? 'ccs-emerald' : fid.honored >= fid.total/2 ? 'ccs-amber' : 'ccs-red'}`} style={{fontWeight: 500}}>
                    {fid.honored}/{fid.total}
                  </div>
                )}
              </div>

              {isExpanded && policy && (
                <div className="border-t ccs-border p-5 space-y-5">

                  {/* Policy variables block */}
                  <div>
                    <div className="text-xs uppercase tracking-wider ccs-slate font-medium mb-2">What the simulator reads for this team</div>
                    <div className="grid grid-cols-2 gap-3">
                      <div className="ccs-card p-3">
                        <div className="text-xs ccs-slate mb-1">dataNeverIntoAI</div>
                        <div className="font-mono text-sm ccs-navy">
                          {policy.dataNeverIntoAI.length > 0 ? policy.dataNeverIntoAI.join(', ') : '(empty)'}
                        </div>
                      </div>
                      <div className="ccs-card p-3">
                        <div className="text-xs ccs-slate mb-1">humanOnlyTasks</div>
                        <div className="font-mono text-sm ccs-navy">
                          {policy.humanOnlyTasks.length > 0 ? policy.humanOnlyTasks.join(', ') : '(empty)'}
                        </div>
                      </div>
                      <div className="ccs-card p-3">
                        <div className="text-xs ccs-slate mb-1">disclosureRequired</div>
                        <div className="font-mono text-sm ccs-navy">{String(policy.disclosureRequired)}</div>
                      </div>
                      <div className="ccs-card p-3">
                        <div className="text-xs ccs-slate mb-1">namedChecker</div>
                        <div className="text-sm ccs-navy">{policy.namedChecker}</div>
                      </div>
                    </div>
                  </div>

                  {/* 4D rules */}
                  <div>
                    <div className="text-xs uppercase tracking-wider ccs-slate font-medium mb-2">Their 4D rules (verbatim from S5)</div>
                    <div className="space-y-1 text-sm">
                      <div><span className="ccs-navy font-medium">Creation:</span> <span className="ccs-slate">{policy.rules.creation}</span></div>
                      <div><span className="ccs-navy font-medium">Transparency:</span> <span className="ccs-slate">{policy.rules.transparency}</span></div>
                      <div><span className="ccs-navy font-medium">Deployment:</span> <span className="ccs-slate">{policy.rules.deployment}</span></div>
                      <div><span className="ccs-navy font-medium">Diligence:</span> <span className="ccs-slate">{policy.rules.diligence}</span></div>
                    </div>
                  </div>

                  {/* Picks + verdicts */}
                  {picksCount > 0 && (
                    <div>
                      <div className="text-xs uppercase tracking-wider ccs-slate font-medium mb-2">
                        Their picks ({picksCount}/5) {t.completed ? '· submitted' : '· DRAFT (submit not pressed)'}
                      </div>
                      <div className="space-y-2">
                        {CASE_0.decisions.map(dec => {
                          const pickId = (t.picks || {})[dec.key];
                          const opt = pickId ? dec.options.find(o => o.id === pickId) : null;
                          if (!opt) {
                            return (
                              <div key={dec.key} className="ccs-card p-3 flex items-center gap-3">
                                <div className="text-xs ccs-slate font-medium w-14">Task {dec.taskNumber}</div>
                                <div className="flex-1 text-sm ccs-slate italic">(not picked yet)</div>
                              </div>
                            );
                          }
                          // Compute violations for this specific pick
                          const violations = [];
                          if (opt.policyTouches.includes('creation')) {
                            const dataExposed = opt.dataExposed || [];
                            const humanUsed = opt.humanTaskUsed || [];
                            if (dataExposed.some(d => policy.dataNeverIntoAI.includes(d))) violations.push('creation_data');
                            if (humanUsed.some(h => policy.humanOnlyTasks.includes(h))) violations.push('creation_human');
                          }
                          if (opt.policyTouches.includes('transparency') && policy.disclosureRequired) {
                            const bypassIds = ['ai_full_auto','ai_spot_check','ai_auto_email','ai_full_resolve','ai_auto_deploy','ai_module'];
                            if (bypassIds.includes(opt.id)) violations.push('transparency');
                          }
                          if (opt.policyTouches.includes('deployment') && !policy.deploymentCheckerBypassAllowed) {
                            const bypassIds = ['ai_full_auto','ai_spot_check','ai_auto_email','ai_full_resolve','ai_auto_deploy','ai_module'];
                            if (bypassIds.includes(opt.id)) violations.push('deployment');
                          }
                          const honored = violations.length === 0;
                          return (
                            <div key={dec.key} className="ccs-card p-3">
                              <div className="flex items-start gap-3">
                                <div className="text-xs ccs-slate font-medium w-14 pt-0.5">Task {dec.taskNumber}</div>
                                <div className="flex-1">
                                  <div className="text-sm ccs-navy font-medium">{opt.label}</div>
                                  <div className="text-xs ccs-slate font-mono mt-1">{opt.id}</div>
                                </div>
                                <div className={`text-xs font-semibold uppercase tracking-wider whitespace-nowrap ${honored ? 'ccs-emerald' : 'ccs-red'}`}>
                                  {honored ? '✓ honored' : '✗ violates'}
                                </div>
                              </div>
                              {!honored && (
                                <div className="mt-2 pl-14 text-xs ccs-red">
                                  Rules violated: {violations.map(v => violationLabel(v)).join(' · ')}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                      {t.completedAt && (
                        <div className="text-xs ccs-slate mt-2">Submitted: {new Date(t.completedAt).toLocaleString()}</div>
                      )}
                    </div>
                  )}

                  {picksCount === 0 && (
                    <div className="ccs-card p-3 text-sm ccs-slate italic">This team hasn't started yet.</div>
                  )}

                  {/* Reference context */}
                  <div className="text-xs ccs-slate pt-3 border-t ccs-border space-y-1">
                    <div><span className="font-medium ccs-navy">Disclosure text:</span> {policy.disclosureText}</div>
                    <div><span className="font-medium ccs-navy">Strongest rule:</span> {policy.strongestRule}</div>
                    {policy.whereDisagreed && <div><span className="font-medium ccs-navy">Where they flagged tension:</span> {policy.whereDisagreed}</div>}
                  </div>

                  {/* Baseline comparison if revised */}
                  {hasRevisions && (
                    <div className="ccs-card p-4" style={{backgroundColor: '#FEF3C7'}}>
                      <div className="text-xs uppercase tracking-wider font-semibold mb-2" style={{color: '#B45309'}}>
                        BASELINE (Session 5) — preserved for comparison
                      </div>
                      <div className="grid grid-cols-2 gap-2 text-xs">
                        <div><span className="font-medium ccs-navy">dataNeverIntoAI:</span> <span className="font-mono ccs-slate">{baseline.dataNeverIntoAI.join(', ') || '(empty)'}</span></div>
                        <div><span className="font-medium ccs-navy">humanOnlyTasks:</span> <span className="font-mono ccs-slate">{baseline.humanOnlyTasks.join(', ') || '(empty)'}</span></div>
                        <div><span className="font-medium ccs-navy">disclosureRequired:</span> <span className="font-mono ccs-slate">{String(baseline.disclosureRequired)}</span></div>
                        <div><span className="font-medium ccs-navy">Revised at:</span> <span className="ccs-slate">{t.revisedAt ? new Date(t.revisedAt).toLocaleString() : '—'}</span></div>
                      </div>
                    </div>
                  )}

                  {/* Admin actions */}
                  <div className="pt-3 border-t ccs-border flex items-center justify-between flex-wrap gap-2">
                    <div className="text-xs ccs-slate">Admin actions:</div>
                    <div className="flex gap-2">
                      <button onClick={() => onAdminEditTeam && onAdminEditTeam(t.code)}
                        className="px-3 py-1.5 rounded text-xs font-medium bg-white ccs-navy border ccs-border hover:bg-slate-50">
                        Edit this team's policy
                      </button>
                      {hasRevisions && (
                        <button onClick={() => { if (confirm(`Reset ${baseline.firm}'s policy to Session 5 baseline?`)) onAdminResetTeam && onAdminResetTeam(t.code); }}
                          className="px-3 py-1.5 rounded text-xs font-medium bg-white ccs-red border" style={{borderColor: '#B91C1C'}}>
                          Reset to baseline
                        </button>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {isExpanded && !policy && (
                <div className="border-t ccs-border p-5 text-sm ccs-red">
                  No policy on file for this code. The simulator can't score fidelity.
                </div>
              )}
            </div>
          );
        })}
      </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════════
function App() {
  const [data, setData] = useState(null);
  const [view, setView] = useState('login');  // login | admin | dashboard | brief | decisions | debrief | revise | admin-edit
  const [team, setTeam] = useState(null);
  const [picks, setPicks] = useState({});
  const [adminEditCode, setAdminEditCode] = useState(null);

  useEffect(() => { boot(); }, []);

  async function boot() {
    const d = await loadData();
    if (d) setData(d);
    else { const fresh = createInitialState(); await saveData(fresh); setData(fresh); }
    const boot = document.getElementById('boot'); if (boot) { boot.classList.add('hidden'); setTimeout(() => boot.remove(), 400); }
    // Poll
    setInterval(async () => {
      const latest = await loadData();
      if (latest) setData(cur => JSON.stringify(cur) === JSON.stringify(latest) ? cur : latest);
    }, (window.CCS_CONFIG && window.CCS_CONFIG.POLL_SECONDS || 10) * 1000);
  }

  if (!data) return <div />;

  async function handleLogin(code, firmName) {
    const t = data.teams.find(x => x.code === code);
    if (!t) return;
    const updatedTeam = { ...t, firmName };
    const newData = { ...data, teams: data.teams.map(x => x.code === code ? updatedTeam : x) };
    await saveData(newData); setData(newData);
    setTeam(updatedTeam);
    setPicks(updatedTeam.picks || {});
    setView('dashboard');
  }

  async function handleReleaseToggle() {
    const newData = { ...data, released: !data.released };
    await saveData(newData); setData(newData);
  }
  async function handleResetAll() {
    const fresh = createInitialState();
    await saveData(fresh); setData(fresh);
  }
  async function handleSubmit() {
    const newTeam = { ...team, picks, completed: true, completedAt: new Date().toISOString() };
    const newData = { ...data, teams: data.teams.map(x => x.code === team.code ? newTeam : x) };
    await saveData(newData); setData(newData); setTeam(newTeam);
    setView('debrief');
  }

  // Student saves their own policy revisions
  async function handleSavePolicy(revisedPolicy) {
    const now = new Date().toISOString();
    const newTeam = { ...team, revisedPolicy, revisedAt: now };
    const newData = { ...data, teams: data.teams.map(x => x.code === team.code ? newTeam : x) };
    await saveData(newData); setData(newData); setTeam(newTeam);
    setView('dashboard');
  }

  // Admin toggles policy editing lock
  async function handlePolicyEditToggle() {
    const newData = { ...data, policyEditingUnlocked: !data.policyEditingUnlocked };
    await saveData(newData); setData(newData);
  }

  // Admin saves a team's policy revisions (editing on behalf of a team)
  async function handleAdminSavePolicy(revisedPolicy) {
    if (!adminEditCode) return;
    const now = new Date().toISOString();
    const newData = { ...data, teams: data.teams.map(x =>
      x.code === adminEditCode ? { ...x, revisedPolicy, revisedAt: now } : x) };
    await saveData(newData); setData(newData);
    setAdminEditCode(null);
    setView('admin');
  }

  // Admin resets a team's revisions back to baseline
  async function handleAdminResetTeam(code) {
    const newData = { ...data, teams: data.teams.map(x =>
      x.code === code ? { ...x, revisedPolicy: null, revisedAt: null } : x) };
    await saveData(newData); setData(newData);
  }

  function logout() { setTeam(null); setPicks({}); setAdminEditCode(null); setView('login'); }

  return (
    <React.Fragment>
      <StyleInjection />
      {view === 'login' && <LoginScreen onLogin={handleLogin} onAdmin={() => setView('admin')} />}
      {view === 'admin' && <AdminScreen data={data}
        onReleaseToggle={handleReleaseToggle}
        onLogout={logout}
        onResetAll={handleResetAll}
        onPolicyEditToggle={handlePolicyEditToggle}
        onAdminEditTeam={(code) => { setAdminEditCode(code); setView('admin-edit'); }}
        onAdminResetTeam={handleAdminResetTeam} />}
      {view === 'admin-edit' && adminEditCode && (() => {
        const t = data.teams.find(x => x.code === adminEditCode);
        return <RevisePolicyScreen team={t} teamCode={adminEditCode} isAdmin={true}
          onSave={handleAdminSavePolicy} onCancel={() => { setAdminEditCode(null); setView('admin'); }} />;
      })()}
      {view === 'dashboard' && team && <Dashboard data={data} team={team}
        onBegin={() => setView('brief')}
        onReviewDebrief={() => setView('debrief')}
        onLogout={logout}
        onRevisePolicy={() => setView('revise')} />}
      {view === 'revise' && team && <RevisePolicyScreen team={team} teamCode={team.code}
        onSave={handleSavePolicy} onCancel={() => setView('dashboard')} />}
      {view === 'brief' && team && <BriefScreen team={team}
        onContinue={() => setView('decisions')}
        onBack={() => setView('dashboard')} />}
      {view === 'decisions' && team && <DecisionsScreen team={team} picks={picks} setPicks={setPicks}
        onSubmit={handleSubmit}
        onBack={() => setView('brief')} />}
      {view === 'debrief' && team && <DebriefScreen team={team}
        onBackToDashboard={() => setView('dashboard')} />}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
