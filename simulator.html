<script>
  // =====================================================================
  //  window.storage shim — Google Sheets backend with localStorage mirror
  //
  //  Reads: GET  <SHEETS_URL>?key=<key>   → returns the stored JSON string
  //  Writes: POST <SHEETS_URL>             → body: {"key":"...","value":"..."}
  //
  //  Uses Content-Type: text/plain to avoid CORS preflight on Apps Script.
  //  All writes mirror to localStorage immediately so the UI stays snappy;
  //  the sheet is written in the background. If the sheet is unreachable,
  //  localStorage keeps the session alive — state resyncs on next page load.
  // =====================================================================
  (function () {
    const LS_PREFIX = 'ccs::';
    const cfg = window.CCS_CONFIG || {};
    const url = (cfg.SHEETS_URL || '').trim();
    const hasBackend = url && url.startsWith('http');

    if (!hasBackend) {
      document.getElementById('config-banner').classList.add('show');
    }

    async function readSheet(key) {
      const resp = await fetch(url + '?key=' + encodeURIComponent(key), {
        method: 'GET', redirect: 'follow',
      });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return await resp.text();
    }

    async function writeSheet(payload) {
      // text/plain avoids CORS preflight — Apps Script handles it
      await fetch(url, {
        method: 'POST', redirect: 'follow',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload),
      });
    }

    window.storage = {
      async get(key /*, shared */) {
        // Try sheet first, fall back to localStorage
        if (hasBackend) {
          try {
            const text = await readSheet(key);
            if (text) {
              try { localStorage.setItem(LS_PREFIX + key, text); } catch (_) {}
              return { value: text };
            }
          } catch (e) {
            console.warn('[CCS] Sheet read failed, using local cache:', e.message);
          }
        }
        try {
          const raw = localStorage.getItem(LS_PREFIX + key);
          return raw ? { value: raw } : null;
        } catch (_) { return null; }
      },

      async set(key, value /*, shared */) {
        // Mirror locally first so the UI is instant
        try { localStorage.setItem(LS_PREFIX + key, value); } catch (_) {}
        if (!hasBackend) return true;
        try {
          await writeSheet({ key: key, value: value });
          return true;
        } catch (e) {
          console.warn('[CCS] Sheet write failed:', e.message);
          return false;
        }
      },

      async delete(key) {
        try { localStorage.removeItem(LS_PREFIX + key); } catch (_) {}
        if (!hasBackend) return true;
        try {
          await writeSheet({ key: key, action: 'delete' });
          return true;
        } catch (e) { return false; }
      },

      // Marker so the app knows it's running against a real backend
      _hasSharedBackend: hasBackend,
    };
  })();

  window.addEventListener('error', function (ev) {
    console.error('[CCS] Load error:', ev.message, 'at', ev.filename, ev.lineno);
  });
</script>

*"I'm already losing money to fraud with paper processes. What happens when I open up a website? Do I need a whole IT department just to protect myself? Is it worth it?"*

This is a real concern, not a rhetorical one. A poorly-designed public website — particularly one with full e-commerce checkout — would dramatically expand the fraud surface. Bot-driven cart manipulation, fake business accounts, payment cycling, account takeovers from compromised customer credentials. Cornerstone has no in-house IT capacity to monitor this.

**Why this matters for your design:**

Scope decisions interact with fraud exposure. A logged-in B2B portal limited to existing customers has very different fraud properties than a fully-public e-commerce site. The scope decision (D3) and the risk-mitigation decision (D10) together determine whether the website is something Ray can sleep at night with, or something that costs him another $30K six months in.

**What Ray won't accept:**
- Any design that requires him to hire IT staff he doesn't currently have
- Any rollout that runs without a kill-switch he can pull personally
- Any "we'll figure out fraud later" framing`
    },
    {
      key: 'ray_template',
      title: "Ray's Technology Template (The CNC Story)",
      icon: '⚙️',
      type: 'examples',
      content: `Ray owns a smaller tool-sharpening business on the side. About ten years ago, he automated parts of that business with CNC equipment. The story is the most-told story in his repertoire when someone tries to sell him technology.

**The pattern:**
1. He spent the first three years of the tool-sharpening business doing every operation by hand. Sharpening drills, mills, taps — each one individually.
2. He learned what "good" looked like at a tactile level. He could tell from the sound of the grinder when a bit was finished.
3. *Then* he bought the CNC equipment.
4. When the CNC produced a finished bit, he could verify it visually and tactilely because he already knew what right looked like.
5. He still does some operations by hand. Not for production — to keep his eye.

**Ray's own framing:**

*"I'm not against automation. I'm against automation you don't understand. If I'd bought the CNC equipment in year one, I'd have shipped a lot of garbage and not known it was garbage. Because I learned by hand first, the machine works for me. It's an extension of what I already know."*

**Why this matters for your case design:**

If your AI system requires Ray (or Linda) to trust outputs they can't independently verify, you have failed Ray's template. The system needs to be explainable in the same way the CNC equipment is — Ray needs to be able to look at a price the AI suggested and understand *why* it's the right price. Black-box pricing is a non-starter, regardless of how technically sound it is.

**Implication for the 4D decisions:**

- *Description*: Ray's template strongly favors the "explain methodology to sales" and the "Full 3P" options. He needs Performance specification because *he* is going to ask the system how it handled an edge case.
- *Discernment*: Ray will want salespeople to actually review the AI's outputs, at least at first. "Trust the system" approaches fail his template entirely.
- *Diligence*: The kill-switch and Ray-veto option isn't paranoia — it's continuity with his CNC template. He runs the system until he doesn't, and he gets to decide when.

**Ray's own words on this:**

// HELPERS
// ═══════════════════════════════════════════════════════════════════
function formatNumber(val, dim) {
  if (val == null || isNaN(val)) return '—';
  if (dim.isMoney) return `$${Math.round(val).toLocaleString('en-US')}`;
  const fixed = Number(val).toFixed(dim.decimals || 0);
  return `${fixed}${dim.unit || ''}`;
}

function calculateForecast(decisionMap, caseData) {
  // Start from baseline
  const result = {};
  caseData.dimensions.forEach(dim => { result[dim.key] = dim.baseline; });

  // Apply effects from each chosen option
  for (const panel of caseData.panels) {
    for (const decision of panel.decisions) {
      const choice = decisionMap[decision.key];
      if (!choice) continue;
      const option = decision.options.find(o => o.id === choice);
      if (!option) continue;
      for (const [k, v] of Object.entries(option.effects)) {
        if (result[k] != null) result[k] += v;
      }
    }
  }

  // Clamp each dimension to its valid range
  for (const dim of caseData.dimensions) {
    const [lo, hi] = dim.validRange || [0, Infinity];
    if (dim.decimals === 0 || dim.isMoney) {
      result[dim.key] = Math.max(lo, Math.min(hi, Math.round(result[dim.key])));
    } else {
      result[dim.key] = Math.max(lo, Math.min(hi, result[dim.key]));
    }
  }
  return result;
}

function processActuals(decisionMap, caseData) {
  // Step 1: compute baseline forecast
  const forecast = calculateForecast(decisionMap, caseData);

  // Step 2: apply random variance to each dimension
  const actuals = {};
  for (const dim of caseData.dimensions) {
    const base = forecast[dim.key];
    const baseline = dim.baseline;
    const delta = base - baseline;
    // Variance scales with magnitude of delta — bigger swings, bigger variance
    const variance = Math.abs(delta) * RANDOM_VARIANCE;
    const roll = (Math.random() * 2 - 1) * variance;
    actuals[dim.key] = base + roll;
  }

  // Step 3: process triggers in order
  // State exposes actuals to trigger conditions via generic `actuals` field plus legacy keys for CASE_1 compatibility
  const triggered = new Set();
  const firedVignettes = [];
  const state = {
    triggered,
    actuals,
    // Legacy aliases used by CASE_1 trigger conditions
    calculatedHours: actuals.hours,
    calculatedBrand: actuals.brand,
    actualRetention: actuals.retention
  };

  for (const trigger of caseData.triggers) {
    if (trigger.condition(decisionMap, state)) {
      if (Math.random() < trigger.probability) {
        triggered.add(trigger.id);
        firedVignettes.push({ id: trigger.id, name: trigger.name, vignette: trigger.vignette });
        for (const [k, v] of Object.entries(trigger.effects)) {
          if (actuals[k] != null) actuals[k] += v;
        }
        // Refresh legacy aliases for downstream triggers
        state.calculatedHours = actuals.hours;
        state.calculatedBrand = actuals.brand;
        state.actualRetention = actuals.retention;
      }
    }
  }

  // Final clamping per dimension's validRange
  for (const dim of caseData.dimensions) {
    const [lo, hi] = dim.validRange || [0, Infinity];
    if (dim.decimals === 0 || dim.isMoney) {
      actuals[dim.key] = Math.max(lo, Math.min(hi, Math.round(actuals[dim.key])));
    } else {
      actuals[dim.key] = Math.max(lo, Math.min(hi, actuals[dim.key]));
    }
  }

  return { actuals, firedVignettes };
}

function calculateScore(actuals, teamForecast, caseData) {
  // Base composite score using the case's own scoring function
  let baseScore = 0;
  for (const dim of caseData.dimensions) {
    const ds = caseData.scoreDimension(dim, actuals[dim.key]);
    baseScore += ds * caseData.scoringWeights[dim.key];
  }

  // Forecast accuracy modifier
  let modifier = 0;
  if (teamForecast) {
    let totalErr = 0;
    let count = 0;
    for (const dim of caseData.dimensions) {
      const f = teamForecast[dim.key];
      const a = actuals[dim.key];
      if (f == null || isNaN(f)) continue;
      // normalize by the dimension's declared forecast scale
      const scale = dim.forecastScale || 100;
      const err = Math.abs(f - a) / scale;
      totalErr += err;
      count += 1;
    }
    const avgErr = count > 0 ? totalErr / count : 0;
    // 0% err → +5, 20% err → 0, 40%+ err → -5
    modifier = Math.max(-FORECAST_MODIFIER_MAX, Math.min(FORECAST_MODIFIER_MAX, FORECAST_MODIFIER_MAX - (avgErr * 50)));
  }

  return Math.round((baseScore + modifier) * 10) / 10;
}

function downloadText(filename, content) {
  const blob = new Blob([content], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function createInitialState() {
  return {
    initialized: true,
    cases: [
      { id: 1, released: false, name: CASE_1.name },
      { id: 2, released: false, name: CASE_2.name },
      { id: 3, released: false, name: CASE_3.name }
    ],
    teams: TEAM_CODES.map((code, i) => ({
      id: i + 1,
      code,
      firmName: null,
      caseProgress: {}
    }))
  };
}

function LoginScreen({ data, onTeamLogin, onAdminLogin }) {
  const [mode, setMode] = useState('select');
  const [code, setCode] = useState('');
  const [password, setPassword] = useState('');
  const [showPassword, setShowPassword] = useState(false);
  const [error, setError] = useState('');

  function handleTeam() {
    setError('');
    const result = onTeamLogin(code);
    if (result.error) setError(result.error);
  }

  function handleAdmin() {
    setError('');
    const result = onAdminLogin(password);
    if (result.error) setError(result.error);
  }

  return (
    <div className="min-h-screen ccs-cream font-body flex items-center justify-center p-6">
      <div className="w-full max-w-md ccs-fade-up">
        <div className="text-center mb-10">
          <div className="inline-block mb-4 ccs-navy-bg text-white px-3 py-1 text-xs tracking-widest uppercase rounded-sm">
            MGMT 459
          </div>
          <h1 className="font-display text-5xl ccs-navy font-medium mb-3">
            Consulting Case<br />Simulator
          </h1>
          <p className="ccs-slate text-sm max-w-xs mx-auto leading-relaxed">
            Real case studies. Real decisions. Live with the consequences of your strategic recommendations.
          </p>
        </div>

        <div className="ccs-card p-8">
          {mode === 'select' && (
            <div className="space-y-3">
              <button onClick={() => { setMode('team'); setError(''); }}
                className="w-full ccs-navy-bg ccs-hover-navy text-white py-3 px-4 rounded font-medium text-sm flex items-center justify-between transition-colors">
                <span className="flex items-center gap-2"><Users size={16} /> Team Login</span>
                <ChevronRight size={14} className="opacity-60" />
              </button>
              <button onClick={() => { setMode('admin'); setError(''); }}
                className="w-full bg-transparent ccs-slate py-3 px-4 rounded font-medium text-xs flex items-center justify-center gap-2 hover:opacity-100 opacity-70">
                <Lock size={12} /> Instructor Access
              </button>
            </div>
          )}

          {mode === 'team' && (
            <div className="space-y-4">
              <div>
                <label className="block text-xs uppercase tracking-wider ccs-slate mb-2 font-medium">Team Code</label>
                <input type="text" value={code}
                  onChange={e => setCode(e.target.value.replace(/\D/g, '').slice(0, 4))}

                  placeholder="0000"
                  className="ccs-input text-center text-2xl tabular tracking-widest"
                  autoFocus maxLength={4} />
              </div>
              {error && <div className="text-xs ccs-red flex items-center gap-1"><AlertCircle size={12} /> {error}</div>}
              <div className="flex gap-2">
                <button onClick={() => { setMode('select'); setCode(''); setError(''); }}
                  className="flex-1 bg-white ccs-navy border ccs-border py-3 rounded text-sm font-medium hover:bg-slate-50">
                  Back
                </button>
                <button onClick={handleTeam} disabled={code.length !== 4}
                  className="flex-1 ccs-navy-bg ccs-hover-navy text-white py-3 rounded text-sm font-medium disabled:opacity-40">
                  Enter
                </button>
              </div>
            </div>
          )}

          {mode === 'admin' && (
            <div className="space-y-4">
              <div>
                <label className="block text-xs uppercase tracking-wider ccs-slate mb-2 font-medium">Instructor Password</label>
                <div className="relative">
                  <input type={showPassword ? "text" : "password"} value={password}
                    onChange={e => setPassword(e.target.value)}
                    onKeyDown={e => { if (e.key === 'Enter' && password) handleAdmin(); }}
                    className="ccs-input pr-10" autoFocus />
                  <button type="button" onClick={() => setShowPassword(!showPassword)}
                    className="absolute right-3 top-1/2 -translate-y-1/2 ccs-slate">
                    {showPassword ? <EyeOff size={16} /> : <Eye size={16} />}
                  </button>
                </div>
              </div>
              {error && <div className="text-xs ccs-red flex items-center gap-1"><AlertCircle size={12} /> {error}</div>}
              <div className="flex gap-2">
                <button onClick={() => { setMode('select'); setPassword(''); setError(''); }}
                  className="flex-1 bg-white ccs-navy border ccs-border py-3 rounded text-sm font-medium hover:bg-slate-50">
                  Back
                </button>
                <button onClick={handleAdmin} disabled={!password}
                  className="flex-1 ccs-navy-bg ccs-hover-navy text-white py-3 rounded text-sm font-medium disabled:opacity-40">
                  Enter
                </button>
              </div>
            </div>
          )}
        </div>

        <p className="text-center text-xs ccs-slate mt-6 opacity-60">MGMT 459</p>
      </div>
    </div>
  );
}

// CASE SELECTION SCREEN
// ═══════════════════════════════════════════════════════════════════
function CaseSelectionScreen({ team, data, onSelectCase, onViewLeaderboard, onLogout, onRefresh }) {
  const releasedCases = data.cases || [];
  const progress = team.caseProgress || {};

  const cumulativeScore = Object.values(progress)
    .filter(p => p.status === 'complete' && p.score != null)
    .reduce((sum, p) => sum + p.score, 0);
  const completedCount = Object.values(progress).filter(p => p.status === 'complete').length;

  // Compute rank
  const allTeams = data.teams || [];
  const teamScores = allTeams.map(t => {
    const cumulative = Object.values(t.caseProgress || {})
      .filter(p => p.status === 'complete' && p.score != null)
      .reduce((sum, p) => sum + p.score, 0);
    return { id: t.id, cumulative };
  }).sort((a, b) => b.cumulative - a.cumulative);
  const rank = teamScores.findIndex(t => t.id === team.id) + 1;

  return (
    <div className="min-h-screen ccs-cream font-body">
      <div className="ccs-navy-bg text-white">
        <div className="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
          <div>
            <div className="text-xs opacity-60 uppercase tracking-widest">Consulting Case Simulator</div>
            <div className="font-display text-xl font-medium">{team.firmName}</div>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={onRefresh} className="text-xs opacity-70 hover:opacity-100 px-3 py-1.5 rounded flex items-center gap-1.5">
              <RefreshCw size={12} /> Refresh
            </button>
            <button onClick={onViewLeaderboard} className="text-xs opacity-70 hover:opacity-100 px-3 py-1.5 rounded flex items-center gap-1.5">
              <Trophy size={12} /> Leaderboard
            </button>
            <button onClick={onLogout} className="text-xs opacity-70 hover:opacity-100 px-3 py-1.5 rounded flex items-center gap-1.5">
              <LogOut size={12} /> Log out
            </button>
          </div>
        </div>
      </div>

      <div className="max-w-6xl mx-auto px-6 py-8 ccs-fade-up">
        <div className="mb-8">
          <h1 className="font-display text-4xl ccs-navy font-medium mb-1">Choose a case to begin.</h1>
          <p className="ccs-slate text-sm">Each case is a self-contained consulting engagement. Read the brief, make 9–10 strategic decisions, forecast outcomes, commit.</p>
        </div>

        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-10">
          {[CASE_1, CASE_2, CASE_3].map(caseData => {
            const caseState = releasedCases.find(c => c.id === caseData.id);
            const released = caseState && caseState.released;
            const tp = progress[caseData.id] || { status: 'not_started' };
            const otherTeams = allTeams.filter(t => t.id !== team.id);
            const otherComplete = otherTeams.filter(t => (t.caseProgress?.[caseData.id]?.status === 'complete')).length;

            const status = !released ? 'locked' : tp.status;
            const buttonLabel = status === 'locked' ? 'Locked' :
              status === 'complete' ? 'View Results' :
              status === 'in_progress' ? 'Continue' : 'Begin';

            return (
              <div key={caseData.id} className="ccs-card-elevated p-6 flex flex-col">
                <div className="flex items-start justify-between mb-3">
                  <div className="text-xs uppercase tracking-wider ccs-slate font-medium">Case Study {caseData.id}</div>
                  {status === 'locked' && <div className="text-xs ccs-slate flex items-center gap-1"><Lock size={12} /> Locked</div>}
                  {status === 'not_started' && <div className="text-xs ccs-emerald flex items-center gap-1"><Unlock size={12} /> Available</div>}
                  {status === 'in_progress' && <div className="text-xs ccs-amber flex items-center gap-1"><Clock size={12} /> In Progress</div>}
                  {status === 'complete' && <div className="text-xs ccs-navy flex items-center gap-1"><CheckCircle2 size={12} /> Complete</div>}
                </div>
                <h2 className="font-display text-2xl ccs-navy font-medium mb-1">{caseData.name.replace(`Case Study ${caseData.id}: `, '')}</h2>
                <div className="text-sm ccs-slate font-medium mb-3">{caseData.stakeholder} · {caseData.stakeholderRole}</div>
                <p className="text-sm ccs-slate flex-grow mb-4 leading-relaxed">{caseData.oneLineDescription}</p>

                {status === 'complete' && (
                  <div className="bg-slate-50 border ccs-border rounded p-3 mb-4">
                    <div className="text-xs uppercase tracking-wider ccs-slate mb-1">Your Result</div>
                    <div className="flex items-baseline gap-3">
                      <div className="font-display text-3xl ccs-navy font-medium tabular">{tp.score?.toFixed(1)}</div>
                      <div className="text-xs ccs-slate">/ 100</div>
                      {tp.posture && <div className="text-xs ccs-slate ml-auto uppercase tracking-wider">{tp.posture}</div>}
                    </div>
                  </div>
                )}

                <div className="flex items-center justify-between gap-3">
                  <div className="text-xs ccs-slate">
                    {released ? `${otherComplete + (status === 'complete' ? 1 : 0)} of 12 teams complete` : 'Not yet released'}
                  </div>
                  <button onClick={() => status !== 'locked' && onSelectCase(caseData.id)}
                    disabled={status === 'locked'}
                    className={`px-5 py-2.5 rounded text-sm font-medium ${status === 'locked' ? 'bg-slate-200 ccs-slate cursor-not-allowed' : 'ccs-navy-bg ccs-hover-navy text-white'}`}>
                    {buttonLabel}
                  </button>
                </div>
              </div>
            );
          })}
        </div>

        <div className="ccs-card p-6">
          <h3 className="font-display text-xl ccs-navy font-medium mb-3">Your Standing</h3>
          <div className="grid grid-cols-3 gap-6">
            <div>
              <div className="text-xs uppercase tracking-wider ccs-slate mb-1">Cumulative Score</div>
              <div className="font-display text-3xl ccs-navy font-medium tabular">{cumulativeScore.toFixed(1)}</div>
            </div>
            <div>
              <div className="text-xs uppercase tracking-wider ccs-slate mb-1">Cases Complete</div>
              <div className="font-display text-3xl ccs-navy font-medium tabular">{completedCount} <span className="text-sm ccs-slate">of {data.cases.length}</span></div>
            </div>
            <div>
              <div className="text-xs uppercase tracking-wider ccs-slate mb-1">Current Rank</div>
              <div className="font-display text-3xl ccs-navy font-medium tabular">{rank > 0 ? `#${rank}` : '—'} <span className="text-sm ccs-slate">of {allTeams.length}</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

function MaterialContent({ content }) {
  // Simple markdown-like rendering: paragraphs, **bold**, lists, tables
  const lines = content.split('\n');
  const elements = [];
  let buffer = [];
  let listBuffer = [];
  let orderedBuffer = [];
  let tableBuffer = [];

  function flushBuffer() {
    if (buffer.length) {
      const text = buffer.join(' ');
      elements.push(<p key={elements.length}>{renderInline(text)}</p>);
      buffer = [];
    }
  }
  function flushList() {
    if (listBuffer.length) {
      elements.push(
        <ul key={elements.length}>{listBuffer.map((item, i) => <li key={i}>{renderInline(item)}</li>)}</ul>
      );
      listBuffer = [];
    }
  }
  function flushOrdered() {
    if (orderedBuffer.length) {
      elements.push(
        <ol key={elements.length}>{orderedBuffer.map((item, i) => <li key={i}>{renderInline(item)}</li>)}</ol>
      );
      orderedBuffer = [];
    }
  }
  function flushTable() {
    if (tableBuffer.length) {
      const rows = tableBuffer.map(r => r.split('|').map(c => c.trim()).filter(c => c !== ''));
      const header = rows[0];
      const dataRows = rows.slice(2); // skip separator
      elements.push(
        <table key={elements.length}>
          <thead><tr>{header.map((h, i) => <th key={i}>{h}</th>)}</tr></thead>
          <tbody>{dataRows.map((r, i) => <tr key={i}>{r.map((c, j) => <td key={j}>{c}</td>)}</tr>)}</tbody>
        </table>
      );
      tableBuffer = [];
    }
  }
  function renderInline(text) {
    // Handles **bold** and *italic*. Bold alternative must come first so ** wins over *.
    const parts = text.split(/(\*\*[^*]+\*\*|\*[^*]+\*)/g);
    return parts.map((p, i) => {
      if (p.startsWith('**') && p.endsWith('**')) return <strong key={i}>{p.slice(2, -2)}</strong>;
      if (p.startsWith('*') && p.endsWith('*')) return <em key={i}>{p.slice(1, -1)}</em>;
      return <span key={i}>{p}</span>;
    });
  }

  for (const line of lines) {
    if (line.startsWith('|')) {
      flushBuffer(); flushList(); flushOrdered();
      tableBuffer.push(line);
    } else if (line.startsWith('- ')) {
      flushBuffer(); flushTable(); flushOrdered();
      listBuffer.push(line.slice(2));
    } else if (/^\d+\.\s/.test(line)) {
      flushBuffer(); flushTable(); flushList();
      orderedBuffer.push(line.replace(/^\d+\.\s/, ''));
    } else if (line.trim() === '') {
      flushBuffer(); flushList(); flushTable(); flushOrdered();
    } else {
      flushList(); flushTable(); flushOrdered();
      buffer.push(line);
    }
  }
  flushBuffer(); flushList(); flushTable(); flushOrdered();

  return <>{elements}</>;
}

// DECISION WORKSPACE
// ═══════════════════════════════════════════════════════════════════
function DecisionWorkspace({ caseData, initialDecisions, onContinue, onBack, onViewBrief }) {
  const [decisions, setDecisions] = useState(initialDecisions || {});
  const totalDecisions = caseData.panels.reduce((n, p) => n + p.decisions.length, 0);
  const completedDecisions = Object.keys(decisions).filter(k => decisions[k]).length;
  const allComplete = completedDecisions === totalDecisions;
  const forecast = calculateForecast(decisions, caseData);

  function setDecision(key, value) {
    setDecisions(prev => ({ ...prev, [key]: value }));
  }

  return (
    <div className="min-h-screen ccs-cream font-body">
      <div className="ccs-navy-bg text-white">
        <div className="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
          <div>
            <div className="text-xs opacity-60 uppercase tracking-widest">Decisions · Case {caseData.id}</div>
            <div className="font-display text-xl font-medium">{caseData.stakeholder}</div>
          </div>
          <div className="flex items-center gap-2">
            <button onClick={onViewBrief} className="text-xs opacity-70 hover:opacity-100 px-3 py-1.5 rounded flex items-center gap-1.5">
              <BookOpen size={12} /> Brief
            </button>
            <button onClick={onBack} className="text-xs opacity-70 hover:opacity-100 px-3 py-1.5 rounded flex items-center gap-1.5">
              <ArrowLeft size={12} /> Cases
            </button>
          </div>
        </div>
      </div>

      <div className="max-w-7xl mx-auto px-6 py-8 ccs-fade-up">
        <div className="mb-6">
          <h1 className="font-display text-3xl ccs-navy font-medium mb-1">Strategic Decisions</h1>
          <div className="flex items-center gap-4">
            <p className="text-sm ccs-slate">{completedDecisions} of {totalDecisions} decisions made.</p>
            <div className="flex-grow max-w-sm h-1 bg-slate-200 rounded overflow-hidden">
              <div className="h-full ccs-emerald-bg transition-all" style={{ width: `${(completedDecisions / totalDecisions) * 100}%` }}></div>
            </div>
          </div>
        </div>

        <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
          {/* Panels — left 2/3 */}
          <div className="lg:col-span-2 space-y-6">
            {caseData.panels.map(panel => (
              <div key={panel.key} className="ccs-card-elevated p-6">
                <div className="mb-1">
                  <span className="inline-block text-xs uppercase tracking-widest ccs-navy-bg text-white px-2 py-0.5 rounded mr-2 font-medium">{panel.label}</span>
                  <span className="text-xs ccs-slate">{panel.description}</span>
                </div>
                <div className="mt-4 space-y-5">
                  {panel.decisions.map(d => (
                    <div key={d.key}>
                      <div className="text-sm font-medium ccs-navy mb-2">{d.label}</div>
                      <div className="space-y-2">
                        {d.options.map(opt => {
                          const selected = decisions[d.key] === opt.id;
                          return (
                            <button key={opt.id} onClick={() => setDecision(d.key, opt.id)}
                              className={`w-full text-left px-3 py-2.5 rounded border text-sm transition-all ${selected ? 'ccs-navy-bg text-white border-transparent' : 'bg-white ccs-navy ccs-border hover:bg-slate-50'}`}>
                              {opt.label}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>

          {/* Forecast Sidebar — right 1/3 */}
          <div className="lg:col-span-1">
            <div className="sticky top-6">
              <div className="ccs-card-elevated p-5 mb-4">
                <div className="text-xs uppercase tracking-wider ccs-slate font-medium mb-3">System Forecast</div>
                <div className="space-y-3">
                  {caseData.dimensions.map(dim => {
                    const baseline = dim.baseline;
                    const projected = forecast[dim.key];
                    const delta = projected - baseline;
                    const better = dim.isInverse ? delta < 0 : delta > 0;
                    return (
                      <div key={dim.key} className="flex items-start justify-between">
                        <div>
                          <div className="text-xs ccs-slate">{dim.label}</div>
                          <div className="text-lg font-display ccs-navy tabular">{formatNumber(projected, dim)}</div>
                        </div>
                        <div className={`text-xs flex items-center gap-0.5 mt-1 ${delta === 0 ? 'ccs-slate' : better ? 'ccs-emerald' : 'ccs-red'}`}>
                          {delta !== 0 && (delta > 0 ? <TrendingUp size={11} /> : <TrendingDown size={11} />)}
                          {delta === 0 ? '—' : `${delta > 0 ? '+' : ''}${dim.isMoney ? '$' : ''}${dim.decimals ? delta.toFixed(dim.decimals) : Math.round(delta)}`}
                        </div>
                      </div>
                    );
                  })}
                </div>
                <div className="text-xs ccs-slate mt-4 pt-3 border-t ccs-border leading-relaxed">
                  These are the system's projections. Actual results will vary based on randomness, decision interactions, and stakeholder reactions.
                </div>
              </div>

              <button onClick={() => onContinue(decisions)} disabled={!allComplete}
                className="w-full ccs-navy-bg ccs-hover-navy text-white py-3 rounded text-sm font-medium disabled:opacity-40 flex items-center justify-center gap-2">
                Continue to Forecast <ArrowRight size={14} />
              </button>
              {!allComplete && (
                <div className="text-xs ccs-slate mt-2 text-center">Make all {totalDecisions} decisions to continue.</div>
              )}
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// FORECAST INPUT SCREEN
// ═══════════════════════════════════════════════════════════════════
function ForecastInput({ caseData, decisions, initialForecast, initialPosture, onCommit, onBack }) {
  const [forecast, setForecast] = useState(initialForecast || {});
  const [posture, setPosture] = useState(initialPosture || '');
  const [agreed, setAgreed] = useState(false);
  const [confirming, setConfirming] = useState(false);

  const systemForecast = calculateForecast(decisions, caseData);
  const allFilled = caseData.dimensions.every(d => forecast[d.key] != null && forecast[d.key] !== '' && !isNaN(forecast[d.key]));
  const canCommit = allFilled && posture && agreed;

  function updateForecast(key, value) {
    setForecast(prev => ({ ...prev, [key]: value === '' ? '' : Number(value) }));
  }

  function rangeWarning(dim, val) {
    if (val == null || val === '' || isNaN(val)) return null;
    const v = Number(val);
    const [lo, hi] = dim.validRange || [0, Infinity];
    if (v < lo || v > hi) return `Outside typical range (${dim.validRangeLabel || `${lo}-${hi}`})`;
    return null;
  }

  if (confirming) {
    return (
      <div className="min-h-screen ccs-cream font-body flex items-center justify-center p-6">
        <div className="ccs-card-elevated max-w-lg w-full p-8 ccs-fade-up">
          <div className="text-center mb-6">
            <div className="inline-flex items-center justify-center w-12 h-12 ccs-amber-bg text-white rounded-full mb-3">
              <AlertCircle size={20} />
            </div>
            <h2 className="font-display text-2xl ccs-navy font-medium mb-2">Commit and Process?</h2>
            <p className="text-sm ccs-slate leading-relaxed">
              This locks your decisions and your forecast. The simulation will run the {caseData.horizonMonths}-month outcome and you'll see actual results. You can't redo this case without instructor approval.
            </p>
          </div>
          <div className="flex gap-2">
            <button onClick={() => setConfirming(false)}
              className="flex-1 bg-white ccs-navy border ccs-border py-3 rounded text-sm font-medium hover:bg-slate-50">
              Go Back
            </button>
            <button onClick={() => onCommit(decisions, forecast, posture)}
              className="flex-1 ccs-emerald-bg ccs-hover-emerald text-white py-3 rounded text-sm font-medium">

  return (
    <div className="min-h-screen ccs-cream font-body">
      <div className="ccs-navy-bg text-white">
        <div className="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
          <div>
            <div className="text-xs opacity-60 uppercase tracking-widest">Forecast · Case {caseData.id}</div>
            <div className="font-display text-xl font-medium">Your Predictions</div>
          </div>
          <button onClick={onBack} className="text-xs opacity-70 hover:opacity-100 px-3 py-1.5 rounded flex items-center gap-1.5">
            <ArrowLeft size={12} /> Back to Decisions
          </button>
        </div>
      </div>

      <div className="max-w-5xl mx-auto px-6 py-8 ccs-fade-up">
        <div className="mb-8">
          <h1 className="font-display text-3xl ccs-navy font-medium mb-1">Now you tell us.</h1>
          <p className="text-sm ccs-slate">What do <em>you</em> predict will actually happen given your decisions? Your forecast accuracy contributes to your final score (±5%).</p>
        </div>

        {/* Decisions summary */}
        <div className="ccs-card p-5 mb-6">
          <div className="text-xs uppercase tracking-wider ccs-slate font-medium mb-3">Your Strategy</div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-2 text-sm">
            {caseData.panels.flatMap(p => p.decisions).map(d => {
              const choice = decisions[d.key];
              const option = d.options.find(o => o.id === choice);
              return (
                <div key={d.key} className="flex justify-between gap-3 py-1">
                  <span className="ccs-slate text-xs">{d.label}</span>
                  <span className="ccs-navy text-xs font-medium text-right">{option?.label || '—'}</span>
                </div>
              );
            })}
          </div>
        </div>

        {/* Forecast inputs */}
        <div className="ccs-card-elevated p-6 mb-6">
          <div className="mb-4">
            <h2 className="font-display text-xl ccs-navy font-medium mb-1">Predict each outcome</h2>
            <p className="text-xs ccs-slate">{caseData.horizonMonths} months after implementation. What do you expect to see for {caseData.stakeholder.split(' ')[0]}?</p>
          </div>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
            {caseData.dimensions.map(dim => {
              const val = forecast[dim.key];
              const warning = rangeWarning(dim, val);
              const sysVal = systemForecast[dim.key];
              const stepVal = dim.decimals && dim.decimals > 0 ? (1 / Math.pow(10, dim.decimals)).toString() : '1';
              return (
                <div key={dim.key}>
                  <label className="block text-sm font-medium ccs-navy mb-1">{dim.label}</label>
                  <div className="text-xs ccs-slate mb-2">Currently: {formatNumber(dim.baseline, dim)} · System forecast: {formatNumber(sysVal, dim)}</div>
                  <div className="relative">
                    {dim.isMoney && <span className="absolute left-3 top-1/2 -translate-y-1/2 ccs-slate text-sm">$</span>}
                    <input type="number" value={val ?? ''}
                      onChange={e => updateForecast(dim.key, e.target.value)}
                      step={stepVal}
                      placeholder={String(dim.baseline)}
                      className={`ccs-input tabular ${dim.isMoney ? 'pl-7' : ''}`} />
                    {dim.unit && !dim.isMoney && <span className="absolute right-3 top-1/2 -translate-y-1/2 ccs-slate text-xs">{dim.unit.trim()}</span>}
                  </div>
                  {warning && (
                    <div className="text-xs ccs-amber mt-1 flex items-center gap-1">
                      <AlertCircle size={11} /> {warning}. You can still submit.
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        </div>

        {/* Posture */}
        <div className="ccs-card-elevated p-6 mb-6">
          <div className="mb-3">
            <h2 className="font-display text-xl ccs-navy font-medium mb-1">Strategic Posture</h2>
            <p className="text-xs ccs-slate">How would your team characterize the strategy you chose? Appears on the leaderboard.</p>
          </div>
          <div className="grid grid-cols-3 gap-2">
            {[
              { id: 'aggressive_growth', label: 'Aggressive Growth' },
              { id: 'balanced', label: 'Balanced' },
              { id: 'authenticity_first', label: 'Authenticity First' }
            ].map(p => (
              <button key={p.id} onClick={() => setPosture(p.id)}
                className={`px-3 py-2.5 rounded border text-sm font-medium transition-all ${posture === p.id ? 'ccs-navy-bg text-white border-transparent' : 'bg-white ccs-navy ccs-border hover:bg-slate-50'}`}>
                {p.label}
              </button>
            ))}
          </div>
        </div>

        {/* Agreement & commit */}
        <div className="ccs-card p-5 mb-6">
          <label className="flex items-start gap-3 cursor-pointer">
            <input type="checkbox" checked={agreed} onChange={e => setAgreed(e.target.checked)} className="mt-1" />
            <span className="text-sm ccs-navy">Our team has discussed and agrees with these predictions and decisions.</span>
          </label>
        </div>

        <div className="flex items-center justify-between">
          <button onClick={onBack} className="text-sm ccs-slate hover:ccs-navy">← Edit decisions</button>
          <button onClick={() => setConfirming(true)} disabled={!canCommit}
            className="ccs-emerald-bg ccs-hover-emerald text-white px-6 py-3 rounded text-sm font-medium disabled:opacity-40 flex items-center gap-2">
            Commit and Process <ArrowRight size={14} />
          </button>
        </div>
      </div>
    </div>
  );
}

// LEADERBOARD
// ═══════════════════════════════════════════════════════════════════
function LeaderboardScreen({ data, currentTeam, onBack }) {
  const [view, setView] = useState('cumulative');
  const [caseFilter, setCaseFilter] = useState(data.cases[0]?.id);

  const allTeams = (data.teams || []).filter(t => t.firmName);
  const labelForPosture = (p) => {
    if (!p) return '—';
    return p.replace('_', ' ').replace(/\b\w/g, l => l.toUpperCase());
  };

  let rows;
  if (view === 'cumulative') {
    rows = allTeams.map(t => {
      const completed = Object.values(t.caseProgress || {}).filter(p => p.status === 'complete' && p.score != null);
      const cumulative = completed.reduce((sum, p) => sum + p.score, 0);
      return { teamId: t.id, firmName: t.firmName, score: cumulative, cases: completed.length };
    }).sort((a, b) => b.score - a.score);
  } else {
    rows = allTeams.map(t => {
      const p = t.caseProgress?.[caseFilter];
      if (!p || p.status !== 'complete') return null;
      return { teamId: t.id, firmName: t.firmName, score: p.score, posture: p.posture };
    }).filter(Boolean).sort((a, b) => b.score - a.score);
  }

  return (
    <div className="min-h-screen ccs-cream font-body">
      <div className="ccs-navy-bg text-white">
        <div className="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
          <div>
            <div className="text-xs opacity-60 uppercase tracking-widest">Leaderboard</div>
            <div className="font-display text-xl font-medium">Class Standings</div>
          </div>
          <button onClick={onBack} className="text-xs opacity-70 hover:opacity-100 px-3 py-1.5 rounded flex items-center gap-1.5">
            <ArrowLeft size={12} /> Back
          </button>
        </div>
      </div>

      <div className="max-w-5xl mx-auto px-6 py-8 ccs-fade-up">
        <div className="flex gap-2 mb-6">
          <button onClick={() => setView('cumulative')}
            className={`px-4 py-2 rounded text-sm font-medium ${view === 'cumulative' ? 'ccs-navy-bg text-white' : 'bg-white ccs-navy border ccs-border'}`}>
            Cumulative (Semester)
          </button>
          <button onClick={() => setView('per_case')}
            className={`px-4 py-2 rounded text-sm font-medium ${view === 'per_case' ? 'ccs-navy-bg text-white' : 'bg-white ccs-navy border ccs-border'}`}>
            Per Case
          </button>
          {view === 'per_case' && (
            <select value={caseFilter} onChange={e => setCaseFilter(Number(e.target.value))}
              className="ccs-input" style={{ width: 'auto' }}>
              {data.cases.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          )}
        </div>

        {rows.length === 0 ? (
          <div className="ccs-card p-10 text-center">
            <div className="font-display text-xl ccs-navy mb-2">No results yet</div>
            <div className="text-sm ccs-slate">Teams haven't completed any cases. Check back after some teams finish.</div>
          </div>
        ) : (
          <div className="ccs-card-elevated overflow-hidden">
            <table className="w-full">
              <thead className="ccs-navy-bg text-white text-xs uppercase tracking-wider">
                <tr>
                  <th className="text-left px-6 py-3 font-medium w-16">#</th>
                  <th className="text-left px-6 py-3 font-medium">Firm</th>
                  {view === 'per_case' && <th className="text-left px-6 py-3 font-medium">Posture</th>}
                  {view === 'cumulative' && <th className="text-left px-6 py-3 font-medium">Cases</th>}
                  <th className="text-right px-6 py-3 font-medium">Score</th>
                </tr>
              </thead>
              <tbody>
                {rows.map((r, i) => {
                  const isYou = currentTeam && r.teamId === currentTeam.id;
                  return (
                    <tr key={r.teamId} className={`${i < rows.length - 1 ? 'border-b ccs-border' : ''} ${isYou ? 'bg-amber-50' : ''}`}>
                      <td className="px-6 py-4">
                        <div className={`font-display text-2xl font-medium tabular ${i === 0 ? 'ccs-emerald' : 'ccs-slate'}`}>{i + 1}</div>
                      </td>
                      <td className="px-6 py-4">
                        <div className="font-medium ccs-navy">{r.firmName}</div>
                        {isYou && <div className="text-xs ccs-amber mt-0.5">Your team</div>}
                      </td>
                      {view === 'per_case' && (
                        <td className="px-6 py-4 text-sm ccs-slate">{labelForPosture(r.posture)}</td>
                      )}
                      {view === 'cumulative' && (
                        <td className="px-6 py-4 text-sm ccs-slate">{r.cases}</td>
                      )}
                      <td className="px-6 py-4 text-right font-display text-2xl tabular font-medium ccs-navy">{r.score.toFixed(1)}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

              <button onClick={() => setConfirmReset(true)} className="ccs-red-bg hover:bg-red-700 text-white py-2.5 px-6 rounded text-sm font-medium">
                Reset Simulator

            ) : (
              <div>

                    Yes, reset everything

                </div>
              </div>
            )}

        )}

  return (
    <div>

          <div className="text-xs uppercase tracking-wider ccs-slate mb-1">Teams Registered</div>
          <div className="font-display text-3xl ccs-navy font-medium tabular">{teamsWithFirm.length} <span className="text-sm ccs-slate">of {data.teams.length}</span></div>
        </div>
        <div className="ccs-card p-5">
          <div className="text-xs uppercase tracking-wider ccs-slate mb-1">Cases Released</div>
          <div className="font-display text-3xl ccs-navy font-medium tabular">{releasedCount} <span className="text-sm ccs-slate">of {totalCases}</span></div>

          <div className="text-xs uppercase tracking-wider ccs-slate mb-1">Total Completions</div>

        </div>
        <div className="ccs-card p-5">
          <div className="text-xs uppercase tracking-wider ccs-slate mb-1">Admin Password</div>
          <div className="font-mono text-sm ccs-navy">hoofprint</div>
        </div>
      </div>

      <h2 className="font-display text-xl ccs-navy font-medium mb-3">Team Codes</h2>
      <div className="ccs-card p-5">

            <div key={t.id} className="flex justify-between gap-3 py-1 border-b ccs-border last:border-0">

          ))}

function AdminCases({ data, onReleaseCase }) {
  return (
    <div>
      <h2 className="font-display text-2xl ccs-navy font-medium mb-1">Cases</h2>
      <p className="text-sm ccs-slate mb-6">Release a case to make it available to all teams. Once released, teams see it on their dashboard immediately.</p>
      <div className="space-y-3">
        {data.cases.map(c => (
          <div key={c.id} className="ccs-card p-5 flex items-center gap-4">
            <div className="flex-grow">
              <div className="font-display text-lg ccs-navy">{c.name}</div>
              <div className="text-xs ccs-slate uppercase tracking-wider mt-1">
                {c.released ? <span className="ccs-emerald">Released</span> : <span className="ccs-amber">Locked</span>}
              </div>
            </div>
            <button onClick={() => onReleaseCase(c.id, !c.released)}
              className={`px-4 py-2 rounded text-sm font-medium ${c.released ? 'bg-white ccs-navy border ccs-border hover:bg-slate-50' : 'ccs-emerald-bg ccs-hover-emerald text-white'}`}>
              {c.released ? 'Lock Case' : 'Release Case'}
            </button>
          </div>
        ))}
      </div>
    </div>
  );
}

function AdminTeams({ data, onAllowRetry, onResetTeamCase, onAdjustScore, onRenameFirm }) {
  const [editingFirm, setEditingFirm] = useState({});
  const [adjusting, setAdjusting] = useState({});

  return (
    <div>
      <h2 className="font-display text-2xl ccs-navy font-medium mb-1">Teams</h2>
      <p className="text-sm ccs-slate mb-6">Manage firm names, allow retries, and adjust scores manually.</p>
      <div className="space-y-3">
        {data.teams.map(t => (
          <div key={t.id} className="ccs-card p-5">
            <div className="flex items-center gap-3 mb-3">
              <div className="font-mono text-xs ccs-slate w-16">#{t.code}</div>
              <div className="flex-grow">
                {editingFirm[t.id] !== undefined ? (
                  <div className="flex gap-2">
                    <input type="text" value={editingFirm[t.id]}
                      onChange={e => setEditingFirm(p => ({ ...p, [t.id]: e.target.value }))}
                      className="ccs-input text-sm" />
                    <button onClick={() => { onRenameFirm(t.id, editingFirm[t.id]); setEditingFirm(p => { const n = { ...p }; delete n[t.id]; return n; }); }}
                      className="ccs-navy-bg text-white px-3 py-2 rounded text-xs">Save</button>
                    <button onClick={() => setEditingFirm(p => { const n = { ...p }; delete n[t.id]; return n; })}
                      className="bg-white border ccs-border ccs-navy px-3 py-2 rounded text-xs">Cancel</button>
                  </div>
                ) : (
                  <div className="flex items-center gap-2">
                    <span className="font-medium ccs-navy">{t.firmName || <em className="ccs-slate">Not yet registered</em>}</span>
                    <button onClick={() => setEditingFirm(p => ({ ...p, [t.id]: t.firmName || '' }))}
                      className="ccs-slate hover:ccs-navy"><Edit3 size={12} /></button>
                  </div>
                )}
              </div>
            </div>
            {data.cases.map(c => {
              const p = t.caseProgress?.[c.id];
              if (!p) return null;
              return (
                <div key={c.id} className="border-t ccs-border pt-2 mt-2 text-sm flex items-center gap-3">
                  <div className="flex-grow">
                    <div className="ccs-navy">{c.name}</div>
                    <div className="text-xs ccs-slate">
                      Status: <span className={p.status === 'complete' ? 'ccs-emerald' : 'ccs-amber'}>{p.status.replace('_', ' ')}</span>
                      {p.score != null && <span> · Score: <span className="ccs-navy font-medium tabular">{p.score.toFixed(1)}</span></span>}
                      {p.attemptsAllowed && <span> · Attempts allowed: {p.attemptsAllowed}</span>}
                    </div>
                  </div>
                  {p.status === 'complete' && (
                    <>
                      <button onClick={() => onAllowRetry(t.id, c.id)}
                        className="text-xs bg-white border ccs-border ccs-navy px-3 py-1.5 rounded hover:bg-slate-50">Allow retry</button>
                      <button onClick={() => {
                        const newScore = prompt(`Adjust score for ${t.firmName || 'team'} on case ${c.id}:`, p.score?.toFixed(1));
                        if (newScore !== null && !isNaN(Number(newScore))) {
                          onAdjustScore(t.id, c.id, Number(newScore));
                        }
                      }}
                        className="text-xs bg-white border ccs-border ccs-navy px-3 py-1.5 rounded hover:bg-slate-50">Adjust score</button>
                    </>
                  )}
                  {p.status !== 'not_started' && (
                    <button onClick={() => { if (confirm(`Reset this team's progress on this case?`)) onResetTeamCase(t.id, c.id); }}
                      className="text-xs ccs-red hover:bg-red-50 px-3 py-1.5 rounded">Reset case</button>
                  )}
                </div>
              );
            })}
          </div>
        ))}
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// ADMIN INIT
// ═══════════════════════════════════════════════════════════════════
function AdminInit({ onInit, onLogout }) {
  return (
    <div className="min-h-screen ccs-cream font-body flex items-center justify-center p-6">
      <div className="max-w-lg ccs-fade-up">
        <div className="text-center mb-6">
          <div className="inline-block mb-3 ccs-navy-bg text-white px-3 py-1 text-xs tracking-widest uppercase rounded-sm">Instructor Console</div>
          <h1 className="font-display text-4xl ccs-navy font-medium mb-2">Initialize Simulator</h1>
          <p className="ccs-slate text-sm leading-relaxed">
            Set up the Consulting Case Simulator. Creates 12 team slots with codes, prepares Case Study 1 (locked by default).
          </p>
        </div>
        <div className="ccs-card p-6 mb-4 text-sm ccs-slate space-y-2">
          <div className="flex justify-between"><span>Team slots</span><span className="ccs-navy font-medium tabular">12</span></div>
          <div className="flex justify-between"><span>Cases prepared</span><span className="ccs-navy font-medium tabular">1 (Case Study 1: FitTrack Freelance)</span></div>
          <div className="flex justify-between"><span>Cases released</span><span className="ccs-navy font-medium tabular">0 (release manually)</span></div>
        </div>
        <div className="flex gap-2">
          <button onClick={onLogout} className="flex-1 bg-white ccs-navy border ccs-border py-3 rounded text-sm font-medium hover:bg-slate-50">Cancel</button>
          <button onClick={onInit} className="flex-1 ccs-emerald-bg ccs-hover-emerald text-white py-3 rounded text-sm font-medium">Initialize</button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════════
function App() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [view, setView] = useState('login');
  const [currentTeamId, setCurrentTeamId] = useState(null);
  const [currentCaseId, setCurrentCaseId] = useState(null);
  const [processing, setProcessing] = useState(false);

  // Workspace state for in-progress decisions
  const [workspaceDecisions, setWorkspaceDecisions] = useState({});
  const [workspaceForecast, setWorkspaceForecast] = useState({});
  const [workspacePosture, setWorkspacePosture] = useState('');

  useEffect(() => { loadData(); }, []);
  useEffect(() => {
    if (view === 'select' || view === 'leaderboard' || view === 'admin') {
      const id = setInterval(refreshData, 5000);
      return () => clearInterval(id);
    }
  }, [view]);

  // Self-healing: if the simulator code has cases that aren't in the stored data
  // (e.g. instructor initialized before Case 2 existed), splice them in.
  // New cases default to released: false so the instructor can release them deliberately.
  function migrateData(parsed) {
    if (!parsed || !parsed.cases) return parsed;
    const definedCases = [CASE_1, CASE_2, CASE_3];
    const existingIds = new Set(parsed.cases.map(c => c.id));
    const additions = definedCases
      .filter(cd => !existingIds.has(cd.id))
      .map(cd => ({ id: cd.id, released: false, name: cd.name }));
    if (additions.length === 0) return parsed;
    return { ...parsed, cases: [...parsed.cases, ...additions] };
  }

  async function loadData() {
    setLoading(true);
    try {
      const r = await window.storage.get(STORAGE_KEY, true);
      if (r && r.value) {
        const parsed = migrateData(JSON.parse(r.value));
        setData(parsed);
        // Persist migration so subsequent loads are clean
        if (parsed && parsed.cases && parsed.cases.length > JSON.parse(r.value).cases?.length) {
          try { await window.storage.set(STORAGE_KEY, JSON.stringify(parsed), true); } catch (e) {}
        }
      }
      else setData(null);
    } catch (e) { setData(null); }
    finally { setLoading(false); }
  }

  async function refreshData() {
    try {
      const r = await window.storage.get(STORAGE_KEY, true);
      if (r && r.value) setData(migrateData(JSON.parse(r.value)));
    } catch (e) {}
  }

  async function saveData(newData) {
    setData(newData);
    try { await window.storage.set(STORAGE_KEY, JSON.stringify(newData), true); }
    catch (e) { console.error("Save failed:", e); }
  }

  function handleTeamLogin(code) {
    if (!data || !data.initialized) return { error: "Not initialized yet. Ask the instructor." };
    const t = data.teams.find(t => t.code === code);
    if (!t) return { error: "Invalid team code." };
    setCurrentTeamId(t.id);
    setView(t.firmName ? 'select' : 'firm_setup');
    return { success: true };
  }

  function handleAdminLogin(password) {
    if (password.trim().toLowerCase() !== ADMIN_PASSWORD) return { error: "Invalid password." };
    setView('admin');
    return { success: true };
  }

  function logout() {
    setCurrentTeamId(null);
    setCurrentCaseId(null);
    setWorkspaceDecisions({});
    setWorkspaceForecast({});
    setWorkspacePosture('');
    setView('login');
  }

  async function initialize() { await saveData(createInitialState()); }
  async function resetAll() { await saveData(createInitialState()); }

  async function setFirmName(name) {
    const newData = { ...data, teams: data.teams.map(t => t.id === currentTeamId ? { ...t, firmName: name } : t) };
    await saveData(newData);
    setView('select');
  }

  function selectCase(caseId) {
    const team = data.teams.find(t => t.id === currentTeamId);
    const progress = team?.caseProgress?.[caseId];
    setCurrentCaseId(caseId);
    if (progress?.status === 'complete') {
      setView('results');
    } else if (progress?.status === 'in_progress' && progress.decisions) {
      setWorkspaceDecisions(progress.decisions);
      setWorkspaceForecast(progress.teamForecast || {});
      setWorkspacePosture(progress.posture || '');
      setView('decisions');
    } else {
      setView('brief');
    }
  }

  async function commitCase(decisions, teamForecast, posture) {
    setProcessing(true);
    await new Promise(r => setTimeout(r, 1500)); // pause for drama
    const currentCase = currentCaseId === 1 ? CASE_1 : currentCaseId === 2 ? CASE_2 : CASE_3;
    const systemForecast = calculateForecast(decisions, currentCase);
    const { actuals, firedVignettes } = processActuals(decisions, currentCase);
    const score = calculateScore(actuals, teamForecast, currentCase);

    const progressEntry = {
      status: 'complete',
      decisions,
      systemForecast,
      teamForecast,
      posture,
      actuals,
      vignettes: firedVignettes,
      score,
      completedAt: new Date().toISOString(),
      attemptsAllowed: 1,
      attemptsUsed: 1
    };

    const newData = {
      ...data,
      teams: data.teams.map(t => t.id === currentTeamId
        ? { ...t, caseProgress: { ...t.caseProgress, [currentCaseId]: progressEntry } }
        : t)
    };
    await saveData(newData);
    setProcessing(false);
    setView('results');
  }

  // Admin actions
  async function releaseCase(caseId, released) {
    const newData = { ...data, cases: data.cases.map(c => c.id === caseId ? { ...c, released } : c) };
    await saveData(newData);
  }

  async function allowRetry(teamId, caseId) {
    const newData = {
      ...data,
      teams: data.teams.map(t => t.id === teamId
        ? { ...t, caseProgress: { ...t.caseProgress, [caseId]: { ...t.caseProgress[caseId], status: 'not_started', attemptsAllowed: (t.caseProgress[caseId].attemptsAllowed || 1) + 1 } } }
        : t)
    };
    await saveData(newData);
  }

  async function resetTeamCase(teamId, caseId) {
    const newData = {
      ...data,
      teams: data.teams.map(t => {
        if (t.id !== teamId) return t;
        const cp = { ...t.caseProgress };
        delete cp[caseId];
        return { ...t, caseProgress: cp };
      })
    };
    await saveData(newData);
  }

  async function adjustScore(teamId, caseId, newScore) {
    const newData = {
      ...data,
      teams: data.teams.map(t => t.id === teamId
        ? { ...t, caseProgress: { ...t.caseProgress, [caseId]: { ...t.caseProgress[caseId], score: newScore } } }
        : t)
    };
    await saveData(newData);
  }

  async function renameFirm(teamId, newName) {
    const newData = { ...data, teams: data.teams.map(t => t.id === teamId ? { ...t, firmName: newName.trim() } : t) };
    await saveData(newData);
  }

  if (loading) {
    return (
      <>
        <StyleInjection />
        <div className="min-h-screen ccs-cream font-body flex items-center justify-center">
          <div className="ccs-slate text-sm">Loading...</div>
        </div>
      </>
    );
  }

  if (processing) {
    return (
      <>
        <StyleInjection />
        <ProcessingScreen />
      </>
    );
  }

  const team = currentTeamId && data ? data.teams.find(t => t.id === currentTeamId) : null;
  const caseData = currentCaseId === 1 ? CASE_1 : currentCaseId === 2 ? CASE_2 : currentCaseId === 3 ? CASE_3 : null;
  const teamProgress = team && currentCaseId ? (team.caseProgress?.[currentCaseId] || {}) : {};

  return (
    <>
      <StyleInjection />

      {view === 'login' && (
        <LoginScreen data={data} onTeamLogin={handleTeamLogin} onAdminLogin={handleAdminLogin} />
      )}

      {view === 'admin' && (!data || !data.initialized) && (
        <AdminInit onInit={initialize} onLogout={logout} />
      )}

      {view === 'admin' && data && data.initialized && (
        <AdminDashboard data={data}
          onReleaseCase={releaseCase}
          onAllowRetry={allowRetry}
          onResetTeamCase={resetTeamCase}
          onAdjustScore={adjustScore}
          onRenameFirm={renameFirm}
          onReset={resetAll}
          onLogout={logout}
          onRefresh={refreshData} />
      )}

      {view === 'firm_setup' && team && (
        <FirmNameSetup team={team} onSubmit={setFirmName} onLogout={logout} />
      )}

      {view === 'select' && team && (
        <CaseSelectionScreen team={team} data={data}
          onSelectCase={selectCase}
          onViewLeaderboard={() => setView('leaderboard')}
          onLogout={logout}
          onRefresh={refreshData} />
      )}

      {view === 'brief' && caseData && (
        <CaseBriefScreen caseData={caseData}
          onBegin={() => setView('decisions')}
          onBack={() => setView('select')} />
      )}

      {view === 'decisions' && caseData && (
        <DecisionWorkspace caseData={caseData}
          initialDecisions={workspaceDecisions}
          onContinue={(d) => { setWorkspaceDecisions(d); setView('forecast'); }}
          onBack={() => setView('select')}
          onViewBrief={() => setView('brief')} />
      )}

      {view === 'forecast' && caseData && (
        <ForecastInput caseData={caseData}
          decisions={workspaceDecisions}
          initialForecast={workspaceForecast}
          initialPosture={workspacePosture}
          onCommit={commitCase}
          onBack={() => setView('decisions')} />
      )}

      {view === 'results' && caseData && team && teamProgress.status === 'complete' && (
        <ResultsScreen caseData={caseData} progress={teamProgress}
          onBack={() => setView('select')}
          onViewLeaderboard={() => setView('leaderboard')} />
      )}

      {view === 'leaderboard' && (
        <LeaderboardScreen data={data} currentTeam={team}
          onBack={() => setView(team ? 'select' : 'login')} />
      )}
    </>
  );
}

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);

  setTimeout(function () {
    const boot = document.getElementById('boot');
    if (boot) { boot.classList.add('hidden'); setTimeout(function () { boot.remove(); }, 400); }
  }, 100);
</script>

</body>
</html>
